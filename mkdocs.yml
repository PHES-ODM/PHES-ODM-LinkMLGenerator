site_name: PHES-ODM LinkML Schema Generator
site_description: >-
  Generate LinkML schemas for the PHES-ODM and CDC NWSS wastewater surveillance
  data models from their Excel data dictionaries.
site_url: https://phes-odm.github.io/PHES-ODM-LinkMLGenerator/
repo_url: https://github.com/PHES-ODM/PHES-ODM-LinkMLGenerator
repo_name: PHES-ODM/PHES-ODM-LinkMLGenerator
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: img/ODM-logo.png
  favicon: img/ODM-logo.png
  features:
    # No navigation.tabs: keeping every section in the left sidebar gives a full
    # table of contents for the whole site rather than one tab at a time.
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Griffe reads the source statically, so the heavy runtime
          # dependencies (linkml, pandas, ...) do not need to be installed to
          # build the documentation.
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Required for the :material-...: icons used in the card grid on the home page.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Generate ODM schemas: odm-schemas.md
  - Generate NWSS schemas: nwss-schemas.md
  - Use it from Python: python-api.md
  - Troubleshooting: troubleshooting.md
  - How it works: how-it-works.md
  - The source data dictionaries: data-dictionaries.md
  - Extending the generator: extending.md
  - Contributing: contributing.md
  - Reference:
      - Command-line interface: reference/cli.md
      - Pipeline steps: reference/pipeline-steps.md
      - Output and repository layout: reference/layouts.md
      - Python API: reference/api.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PHES-ODM/PHES-ODM-LinkMLGenerator
    - icon: fontawesome/solid/globe
      link: https://phes-odm.org
