site_name: PHES-ODM LinkML Schema Generator
site_description: >-
  Generate LinkML schemas for the PHES-ODM and CDC NWSS wastewater surveillance
  data models from their published data dictionaries.
site_url: https://phes-odm.github.io/PHES-ODM-LinkMLGenerator/
repo_url: https://github.com/PHES-ODM/PHES-ODM-LinkMLGenerator
repo_name: PHES-ODM/PHES-ODM-LinkMLGenerator
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: img/ODM-logo.png
  favicon: img/ODM-logo.png
  features:
    # No navigation.tabs: keeping every section in the left sidebar gives a full
    # table of contents for the whole site rather than one tab at a time.
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Griffe reads the source statically, so the heavy runtime
          # dependencies (linkml, pandas, ...) do not need to be installed to
          # build the documentation.
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Required for the :material-...: icons used in the card grid on the home page.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# The four sections below are the Diátaxis documentation framework: tutorial
# (learning), how-to guides (doing), reference (looking up), and explanation
# (understanding). A new page belongs to exactly one of them.
nav:
  - Home: index.md
  - Tutorial:
      - Getting started: tutorials/getting-started.md
  - How-to guides:
      - Install the generator: how-to/install.md
      - Generate the ODM schemas: how-to/generate-odm-schemas.md
      - Generate the NWSS schemas: how-to/generate-nwss-schemas.md
      - Roll out a dictionary update: how-to/dictionary-workflow.md
      - Automate a dictionary rollout: how-to/automate-dictionary-rollout.md
      - Trigger generation from another repository: how-to/trigger-from-another-repository.md
      - Use it from Python: how-to/python-api.md
      - Troubleshooting: how-to/troubleshooting.md
      - Extending the generator: how-to/extending.md
      - Contributing: how-to/contributing.md
  - Reference:
      - Command-line interface: reference/cli.md
      - Pipeline steps: reference/pipeline-steps.md
      - Output layout: reference/output-layout.md
      - Repository layout: reference/repository-layout.md
      - The source data dictionaries: reference/data-dictionaries.md
      - Continuous integration: reference/continuous-integration.md
      - Python API: reference/api.md
  - Explanation:
      - How it works: explanation/how-it-works.md
      - Inside an ODM run: explanation/odm-runs.md
      - Inside an NWSS run: explanation/nwss-runs.md
      - Why the dictionaries are hard to read: explanation/data-dictionaries.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PHES-ODM/PHES-ODM-LinkMLGenerator
    - icon: fontawesome/solid/globe
      link: https://phes-odm.org
