[project]
name = "odm-linkmlgen"
version = "0.1.0"
description = "Generate LinkML schemas associated with ODM."
authors = [
    { name="Martin Wellman", email="mwellman@ohri.ca" }
]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.scripts]
odm-linkmlgen-odm = "odm_linkmlgen.make_odm:app"
odm-linkmlgen-odmv1 = "odm_linkmlgen.make_odm_v1:app"
odm-linkmlgen-nwss = "odm_linkmlgen.make_nwss:app"

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odm_linkmlgen"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]