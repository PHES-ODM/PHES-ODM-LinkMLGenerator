  vs_institution_type:
    from_schema: https://onto.phes-odm.org/nwss/reporting
    permissible_values:
      not institution specific:
        description: This sample does not represent wastewater from a single institution,
          facility, or building
      correctional:
        description: A prison, penitentiary, penal facility, jail, detention unit,
          or other facility in which persons are incarcerated by government officials
      long term care - nursing home:
        description: A residential healthcare facility that provides 24-medical care.
          These are also called skilled nursing facilities. Generally licensed by
          CMS.
      long term care - assisted living:
        description: A residential facility that provides assistance with daily care
          but generally does not provide skilled nursing care. May be licensed as
          healthcare facility based on state regulations.
      other long term care:
        description: Other residential facilities that provide daily and/or medical
          care, but are not defined as nursing home/skilled nursing facilities or
          assisted living facilities. An example of this is a state-licensed intermediate
          care facility.
      short stay acute care hospital: {}
      long term acute care hospital:
        description: Acute care hospitals that provide care for patients with average
          length of stay longer than 25 days. LTACH patients are often transferred
          from intensive care units of ACH.
      child day care: {}
      k12:
        description: A school serving students in the kindergarten to 12th grade range
      higher ed dorm:
        description: Solely higher education dormitory buildings
