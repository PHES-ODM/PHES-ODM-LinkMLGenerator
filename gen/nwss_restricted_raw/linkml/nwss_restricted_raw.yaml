    slot_usage:
      reporting_jurisdiction:
        description: The CDC Epidemiology and Laboratory Capacity (ELC) jurisdiction,
          most frequently a state, reporting these data (2-letter abbreviation)
        range: vs_reporting_jurisdiction
      county_names:
        description: 5-digit numeric FIPS codes of all counties and county equivalents
          served by this sampling site (i.e., served by this wastewater treatment
          plant or, if 'sample_location' is "upstream", then by this upstream location).
          Note that most jurisdictions are covered by counties, but some are covered
          by county equivalents, such as independent cities, parishes, or census areas.
        range: string
      population_served:
        description: Estimated number of persons served by this sampling site (i.e.,
          served by this wastewater treatment plant or, if 'sample_location' is "upstream",
          then by this upstream location)
        range: integer
      sewage_travel_time:
        description: What is the approximate sewage travel time, on average, from
          sewage source to this sampling site (i.e., this wastewater treatment plant
          or, if 'sample_location' is "upstream", then this upstream location)? This
          should be specified as a duration in hours, not a time of day.
        range: float
      sample_location:
        description: Sample collection location in the wastewater system, whether
          at a wastewater treatment plant (or other community level treatment infrastructure
          such as community-scale septic) or upstream in the wastewater system
        range: vs_sample_location
      sample_location_specify_id:
        description: If 'sample_location' is "upstream", specify the collection location
          in the wastewater system
        range: string
      wwtp_id:
        description: The ID of the Wastewater Treatment Plant (WWTP) to which this
          wastewater flows.
        range: string
      wwtp_jurisdiction:
        description: State, DC, US territory, or Freely Associated State jurisdiction
          name (2-letter abbreviation) in which the wastewater treatment plant provided
          in 'wwtp_name' is located
        range: vs_wwtp_jurisdiction
      capacity_mgd:
        description: Wastewater treatment plant design capacity
        range: float
      industrial_input:
        description: Approximate average percentage of wastewater from industrial
          sources that is received by the wastewater treatment plant specified in
          'wwtp_name'
        range: float
      stormwater_input:
        description: Does the wastewater treatment plant specified in 'wwtp_name'
          treat water from a combined sewer system (i.e., a sewer system that collects
          both sewage and stormwater)?
        range: vs_yne[stormwater_input]
      influent_equilibrated:
        description: Is influent to the wastewater treatment plant specified in 'wwtp_name'
          ever stored prior to treatment to equilibrate or modulate the influent flow
          rate?
        range: vs_yne[influent_equilibrated]
      sample_type:
        description: Type of sample collected, whether grab or composite. If composite,
          also provide the duration of sampling and type of composite, as listed in
          the Value Set (e.g., "24-hr flow-weighted composite"). A grab sample is
          defined as an individual sample collected without compositing or adding
          other samples, regardless of whether the sample matrix is liquid wastewater
          or sludge.
        range: vs_sample_type
      composite_freq:
        description: 'Frequency of sub-sample collection (for composite samples only):
          for flow-weighted, the number of sub-samples collected per million gallons
          of flow; for time-weighted, the number of sub-samples per hour. Flow-weighted
          example: a value of 5 would indicate 5 sub-samples per million gallons,
          or 1 sub-sample per 200,000 gallons'
        range: float
      sample_matrix:
        description: Wastewater matrix from which the sample was collected
        range: vs_sample_matrix
      collection_storage_time:
        description: Duration of time the sample was stored after collection and prior
          to reaching the lab
        range: float
      collection_storage_temp:
        description: Temperature at which the sample was stored after collection and
          prior to reaching the lab
        range: float
      solids_separation:
        description: Process used to separate solid and liquid phases of the sample,
          either prior to or in the absence of the concentration method specified
          in 'concentration_method'
        range: vs_solids_separation
      concentration_method:
        description: Method used to concentrate the sample prior to analysis of the
          concentrate
        range: vs_concentration_method
      extraction_method:
        description: Method used for nucleic acid extraction from the sample
        range: vs_extraction_method
      pre_conc_storage_time:
        description: The approximate average duration of time between when samples
          reach the lab and when they are concentrated (if concentrated)
        range: float
      pre_conc_storage_temp:
        description: The storage temperature of samples after reaching the lab and
          prior to concentration (if concentrated)
        range: float
      pre_ext_storage_time:
        description: The approximate average duration of time between when samples
          are concentrated (if concentrated) and when they are extracted
        range: float
      pre_ext_storage_temp:
        description: The storage temperature of samples after concentration (if concentrated)
          and prior to extraction
        range: float
      tot_conc_vol:
        description: Total volume of sample concentrated (if concentrated); this total
          volume is not necessarily assayed and is not necessarily equal to the value
          specified in 'equiv_sewage_amt'
        range: float
      ext_blank:
        description: Are extraction blanks included in the extraction process?
        range: vs_yne[ext_blank]
      rec_eff_target_name:
        description: Name of the recovery efficiency control target that is spiked
          in
        range: vs_rec_eff_target_name
      rec_eff_spike_matrix:
        description: Matrix into which the recovery efficiency control target is spiked
        range: vs_rec_eff_spike_matrix
      rec_eff_spike_conc:
        description: "Spike concentration, on average,\_of the recovery control on\
          \ a per sample volume basis"
        range: float
      pasteurized:
        description: Was the sample pasteurized?
        range: vs_yne[pasteurized]
      pcr_target:
        description: The target of the PCR quantification
        range: vs_pcr_target
      pcr_gene_target:
        description: The PCR gene used to quantify PCR target
        range: vs_pcr_gene_target
      pcr_type:
        description: The type of PCR used to quantify the PCR target
        range: vs_pcr_type
      hum_frac_target_mic:
        description: Name of microbial target used to estimate human fecal content
        range: vs_hum_frac_target_mic
      hum_frac_target_chem:
        description: Name of chemical compound used to estimate human fecal content
        range: vs_hum_frac_target_chem
      other_norm_name:
        description: Name of a target or compound not specified in 'hum_frac_target_mic'
          or 'hum_frac_target_chem' used to estimate human fecal content
        range: vs_other_norm_name
      quant_stan_type:
        description: The type of nucleic acid used as a standard for the PCR target
          quantification
        range: vs_quant_stan_type
      num_no_target_control:
        description: Number of no-template controls (NTC) per instrument run
        range: vs_num_no_target_control
      sample_collect_date:
        description: The date of sample collection; for composite samples, specify
          the date on which sample collection began
        range: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      sample_collect_time:
        description: The local time of sample collection; for composite samples, specify
          the time at which sample collection began
        range: string
        pattern: ^[0-2]?[0-9]:[0-5][0-9](:[0-5][0-9])?$
      time_zone:
        description: Current local time zone corresponding to the time specified in
          'sample_collect_time', represented as a UTC time offset (e.g., UTC-06:00)
        range: string
        pattern: ^(UTC|utc)[+|-][0-1][0-9]:[0-5][0-9]$
      flow_rate:
        description: Wastewater volumetric flow rate at the sample collection location
          over the 24-hr period during which the sample was collected. If only an
          instantaneous flow measurement is available, it may be reported in units
          of million gallons per day.
        range: float
      ph:
        description: pH of wastewater sample (if sludge, pH of influent at time of
          collection)
        range: float
      conductivity:
        description: "Specific conductivity of wastewater sample (if sludge,\_conductivity\
          \ of influent at time of collection)"
        range: float
      tss:
        description: Total suspended solids of raw (or, if unavailable, post-grit
          removal) wastewater
        range: float
      collection_water_temp:
        description: Sample temperature at time of collection
        range: float
      equiv_sewage_amt:
        description: Equivalent unconcentrated volume of wastewater or mass of sludge
          in PCR reaction
        range: float
      sample_id:
        description: An ID assigned to a wastewater sample. It must be unique for
          this NWSS reporting jurisdiction. Wastewater samples that are split and
          measured by different labs should have the same sample ID but different
          lab IDs. Wastewater samples for which multiple SARS-CoV-2 PCR targets are
          measured should also have the same sample ID.
        range: string
        pattern: ^[0-9A-Za-z_\-\.]{1,20}$
      lab_id:
        description: An ID assigned to a testing lab. It must be unique across labs
          used for this NWSS reporting jurisdiction's testing. If the same lab is
          used across multiple NWSS reporting jurisdictions, each NWSS reporting jurisdiction
          may assign that lab a different lab ID.
        range: string
        pattern: ^[0-9A-Za-z_\-\.]{1,20}$
      test_result_date:
        description: The date on which this PCR target measurement was made
        range: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      pcr_target_units:
        description: Units of PCR target sample concentration
        range: vs_mic_chem_units
      pcr_target_avg_conc:
        description: "Concentration of the PCR target back-calculated to unconcentrated\_\
          sample basis; enter \"0\" if no amplification occurred, using the definition\
          \ of amplification described in 'ntc_amplify'; otherwise, enter the estimated\
          \ concentration; do not adjust for matrix recovery efficiency. \nOnly the\
          \ technical or biological replicate concentrations for the same pcr_gene_target\
          \ should be averaged. For example, if there are three replicates of a given\
          \ PCR target, average those concentrations and report the average value\
          \ only. Do not include the three individual concentrations. Different pcr_gene_target\
          \ concentrations should not be averaged for this field (e.g., do not average\
          \ concentrations for N1 and N2)."
        range: float
      pcr_target_std_error:
        description: Standard error (SE) of the PCR target in wastewater sample, or
          best estimate that is consistently available. If sample replicates are always
          performed, use SE of sample replicates; else, if processing replicates are
          always performed, use SE of processing replicates; else, if qPCR is performed,
          use SE of PCR replicates; else, if digital PCR is performed, use error from
          multiple replicates if available, and Poisson error if not
        range: float
      pcr_target_cl_95_lo:
        description: "Lower bound of 95%\_confidence interval of the PCR target in\
          \ wastewater sample, or best estimate that is consistently available. Follow\
          \ the same hierarchy as described for standard error. (Note: 'cl' stands\
          \ for confidence limit)"
        range: float
      pcr_target_cl_95_up:
        description: "Upper bound of 95%\_confidence interval of the PCR target in\
          \ wastewater sample, or best estimate that is consistently available. Follow\
          \ the same hierarchy as described for standard error. (Note: 'cl' stands\
          \ for confidence limit)"
        range: float
      pcr_target_below_lod:
        description: Was the concentration of the PCR target below the limit of detection?
        range: vs_yn
      lod_sewage:
        description: PCR target limit of detection back-calculated to unconcentrated
          sample basis
        range: float
      ntc_amplify:
        description: For qPCR, did any no-template controls on this instrument run
          have a Ct value less than 40? For ddPCR, did any no-template controls on
          this instrument run have 3 or more positive droplets?
        range: vs_yn
      rec_eff_percent:
        description: Percent of spiked recovery control, specified in 'rec_eff_target_name',
          that was recovered
        range: float
      inhibition_detect:
        description: Was molecular inhibition detected?
        range: vs_ynn
      inhibition_adjust:
        description: Was inhibition incorporated into the PCR target concentration
          calculation?
        range: vs_yne[inhibition_adjust]
      hum_frac_mic_conc:
        description: Concentration of microbial target specified in 'hum_frac_target_mic';
          follow the same guidelines outlined for 'pcr_target_avg_conc'
        range: float
      hum_frac_mic_unit:
        description: Concentration units of microbial target specified in 'hum_frac_target_mic'
        range: vs_mic_chem_units_e
      hum_frac_chem_conc:
        description: Concentration of chemical target specified in 'hum_frac_target_chem'
        range: float
      hum_frac_chem_unit:
        description: Concentration units of chemical target  specified in 'hum_frac_target_chem'
        range: vs_mic_chem_units_e
      other_norm_conc:
        description: Concentration of target spcified in 'other_norm_name'
        range: float
      other_norm_unit:
        description: Concentration units of target spcified in 'other_norm_name'
        range: vs_mic_chem_units_e
      major_lab_method:
        description: A number used to distinguish major lab methods at the reporting
          jurisdiction level. Differences in lab methods may limit the comparability
          of PCR target concentrations. Reporting jurisdictions should use this field
          to indicate that lab methods are sufficiently different that caution should
          be used when comparing PCR target concentrations across them. These differences
          may result from any lab processing or quantification steps, including different
          PCR gene targets. Note that 'major_lab_method' may be the same for different
          laboratories if the reporting jurisdiction believes concentrations measured
          by those laboratories are comparable; conversely, 'major_lab_method' may
          be different for the same laboratory if changes made to the laboratory protocol
          rendered concentrations not comparable.
        range: integer
      major_lab_method_desc:
        description: "Brief description of the basis for assigning a \u2018major_lab_method\u2019\
          , e.g., \"this lab uses a lab method distinct from other labs in this reporting\
          \ jurisdiction\", \"this lab changed lab methods - new concentration method\"\
          \ or \"lab method is same as other labs in this reporting jurisdiction but\
          \ performance differs\""
        range: string
      sample_first_reported:
        description: Date that a wastewater sample, identified by 'sample_id', was
          first submitted to CDC NWSS
        range: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
  Container:
    from_schema: https://onto.phes-odm.org/nwss/restricted_raw
    slots:
    - nwss
    slot_usage:
      nwss:
        title: nwss
        multivalued: true
        range: nwss
        inlined_as_list: true
    tree_root: true
