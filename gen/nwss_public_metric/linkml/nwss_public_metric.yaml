classes:
  nwss:
    from_schema: https://onto.phes-odm.org/nwss/public_metric
    slots:
    - wwtp_jurisdiction
    - wwtp_id
    - reporting_jurisdiction
    - sample_location
    - sample_location_specify
    - key_plot_id
    - county_names
    - county_fips
    - population_served
    - date_start
    - date_end
    - ptc_15d
    - detect_prop_15d
    - percentile
    - sampling_prior
    - first_sample_date
    slot_usage:
      wwtp_jurisdiction:
        description: State, DC, US territory, or Freely Associated State jurisdiction
          name in which the wastewater treatment plant provided in 'wwtp_name' is
          located.
        range: vs_wwtp_jurisdiction
      wwtp_id:
        description: A unique identifier for wastewater treatment plants. This is
          an arbitrary integer used to provide a unique, but anonymous identifier
          for a wastewater treatment plant. This identifier is consistent over time,
          such that the same plant retains the same ID regardless of the addition
          or subtraction of other plants from the data set.
        range: integer
      reporting_jurisdiction:
        description: The CDC Epidemiology and Laboratory Capacity (ELC) jurisdiction,
          most frequently a state, reporting these data
        range: vs_reporting_jurisdiction
      sample_location:
        description: Sample collection location in the wastewater system, whether
          at a wastewater treatment plant (or other community level treatment infrastructure
          such as community-scale septic) or upstream in the wastewater system.
        range: vs_sample_location
      sample_location_specify:
        description: A unique identifier for "upstream" sample locations. Specifically,
          when 'sample_location' is "upstream", this field has a non-empty value,
          which provides a unique, but anonymous identifier for the upstream sample
          collection sites. This identifier is consistent over time, such that the
          same sample collection site retains the same ID regardless of the addition
          or subtraction of other sample collection sites from the data set.
        range: integer
      key_plot_id:
        description: A unique identifier for the geographic area served by this sampling
          site, called a sewershed. This is an underscore-separated concatenation
          of the fields 'wwtp_jurisdiction', 'wwtp_id', and, if 'sample_location'
          is "upstream", then also 'sample_location_specify', and sample_matrix.
        range: string
      county_names:
        description: The county and county-equivalent names corresponding to the FIPS
          codes in 'county_fips'
        range: string
      county_fips:
        description: 5-digit numeric FIPS codes of all counties and county equivalents
          served by this sampling site (i.e., served by this wastewater treatment
          plant or, if 'sample_location' is "upstream", then by this upstream location).
          Note that multiple sampling sites or treatment plants may serve a single
          county, and that a single sampling site or treatment plant may serve multiple
          counties. Counties listed may be entirely or only partly served by this
          sampling site.
        range: string
      population_served:
        description: Estimated number of persons served by this sampling site (i.e.,
          served by this wastewater treatment plant or, if 'sample_location' is "upstream",
          then by this upstream location).
        range: integer
      date_start:
        description: The start date of the interval over which the metric is calculated.
          Intervals are inclusive of start and end dates.
        range: date
      date_end:
        description: The end date of the interval over which metric is calculated.
          Intervals are inclusive of start and end dates.
        range: date
      ptc_15d:
        description: "This metric shows whether SARS-CoV-2 virus levels have increased\
          \ or decreased over the last 15 days. When levels of virus in wastewater\
          \ are low, a modest increase in virus level can appear much larger when\
          \ you look at the percent change. \nThe percent change in SARS-CoV-2 virus\
          \ levels over the 15-day interval defined by 'date_start' and 'date_end'.\
          \ Percent change is calculated as the modeled change over the interval,\
          \ based on linear regression of log-transformed SARS-CoV-2 levels. SARS-CoV-2\
          \ levels are SARS-CoV-2 virus concentrations in wastewater that have been\
          \ normalized for wastewater composition."
        range: float
      detect_prop_15d:
        description: This metric shows the percentage of wastewater samples at each
          site that were positive for SARS-CoV-2 RNA over the last 15 days. It does
          not show overall levels of SARS-CoV-2 viral RNA in wastewater. The detection
          proportion is the percent calculated by dividing the 15-day sum of SARS-CoV-2
          detections by the 15-day sum of the number of tests for each site and multiplying
          by 100.
        range: float
      percentile:
        description: "This metric shows whether SARS-CoV-2 virus levels at a site\
          \ are currently higher or lower than past historical levels at the same\
          \ site. 0% means levels are the lowest they have been at the site; 100%\
          \ means levels are the highest they have been at the site. Public health\
          \ officials watch for increasing levels of the virus in wastewater over\
          \ time and use this data to help make public health decisions.  \nThe relative\
          \ SARS-CoV-2 virus levels are calculated by ordering the wastewater levels\
          \ for all samples collected since December 1, 2021 from the lowest to highest\
          \ level."
        range: float
      sampling_prior:
        description: Indicates whether the site was collecting wastewater samples
          before or on December 1, 2021.
        range: string
      first_sample_date:
        description: The first date samples were collected at a site.
        range: date
  Container:
    from_schema: https://onto.phes-odm.org/nwss/public_metric
    slots:
    - nwss
    slot_usage:
      nwss:
        title: nwss
        range: nwss
        multivalued: true
        inlined_as_list: true
    tree_root: true
