      sampleCollectionDefault:
        description: Used as default when a new sample is created for this site. See
          collection in Sample table.
        title: Sample collection default
        range: SiteSampleCollectionDefault
      sampleCollectOtherDefault:
        description: Used as default when a new sample is created for this site. See
          collectionOther in Sample table.
        title: Sample collect other default
        range: string
      sampleStorageTempCDefault:
        description: Used as default when a new sample is created for this site. See
          storageTempC in Sample table.
        title: Sample storage temp c default
        range: float
      measureFractionAnalyzedDefault:
        description: Used as default when a new measurement is created for this site.
          See fractionAnalyzed in Measurement table.
        title: Measure fraction analyzed default
        range: SiteMeasureFractionAnalyzedDefault
      geoLat:
        description: 'Site geographical location, latitude in decimal coordinates,
          ie.: (45.424721)'
