        range: string
      type:
        description: Type of site or institution where sample was taken.
        title: Type
        range: SiteType
      typeOther:
        description: Description of the site when the site is not listed. See siteType.
        title: Type other
        range: string
      sampleTypeDefault:
        description: Used as default when a new sample is created for this site. See
