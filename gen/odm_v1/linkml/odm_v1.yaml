classes:
  Container:
    from_schema: https://onto.phes-odm.org/odm/v1
    slots:
    - Sample
    - WWMeasure
    - Site
    - SiteMeasure
    - Reporter
    - Lab
    - AssayMethod
    - Instrument
    - Polygon
    - CovidPublicHealthData
    - Lookup
    slot_usage:
      Sample:
        description: The sample is a representative volume of wastewater taken from
          a Site which is then analysed by a lab.
        title: Wastewater sample data
        multivalued: true
        range: Sample
        inlined_as_list: true
      WWMeasure:
        description: Measurement result (ie. single variable) from a wastewater sample.
          WWMeaasure includes data that is commonly collected by staff at wastewater
          laboratories where measurement is performed using an assay method (see AssayMethod),
          but can also be performed using specific instruments (see Instruments. Measures
          performed at the site of the wastewater sample are reported in SiteMeasure.
        title: Wastewater measurement data
        multivalued: true
        range: WWMeasure
        inlined_as_list: true
      Site:
        description: The site of wastewater sampling, including several defaults that
          can be used to populate new samples upon creation.
        title: site of sample
        multivalued: true
        range: Site
        inlined_as_list: true
      SiteMeasure:
        description: Measurement result (ie. single variable) obtained by at the site
          of wastewater sample.SiteMeasure includes data that is commonly collected
          by staff at wastewater treatment facilities and field sample locations.
          These measures that are not performed on the wastewater sample but provide
          additional context necessary for the interpretation of the results. Measures
          performed on the wastewater sample are reported in WWMeasure.
        title: Site Measurement
        multivalued: true
        range: SiteMeasure
        inlined_as_list: true
      Reporter:
        description: The individual or organization that is reporting and responsible
          for the quality of the data.
        title: Reporter of data
        multivalued: true
        range: Reporter
        inlined_as_list: true
      Lab:
        description: Laboratory that performs SARS-CoV-2 wastewater testing at one
          or more sites.
        title: Lab
        multivalued: true
        range: Lab
        inlined_as_list: true
      AssayMethod:
        description: The assay method that was used to perform testing. Create a new
          record if there are changes (improvements) to an existing assay method.
          Keep the same ID and use an updated version. A new record for a new version
          can include only the fields that changed, however, we recommend duplicating
          existing fields to allow each record to clearly describe all steps. Add
          a current date when recording a new version to an assay.
        title: Assay Method
        multivalued: true
        range: AssayMethod
        inlined_as_list: true
      Instrument:
        description: Instruments that are used for measures in WWMeasure and SiteMeasure.
          The assay method for viral measurement are described in AssayMethod.
        title: Instrument
        multivalued: true
        range: Instrument
        inlined_as_list: true
      Polygon:
        description: A simple polygon that encloses an area on the surface of the
          earth, normally these polygons will either be of a sewer catchment area
          or of a health region or other reporting area.
        title: Area
        multivalued: true
        range: Polygon
        inlined_as_list: true
      CovidPublicHealthData:
        description: Covid-19 patient data for a specified polygon.
        title: Covid Public Health
        multivalued: true
        range: CovidPublicHealthData
        inlined_as_list: true
      Lookup:
        description: Used for lookup values of all category based columns
        title: Lookup Table
        multivalued: true
        range: Lookup
        inlined_as_list: true
    tree_root: true
  Sample:
    description: The sample is a representative volume of wastewater taken from a
      Site which is then analysed by a lab.
    title: Wastewater sample data
    slots:
    - sampleID
    - siteID
    - instrumentID
    - reporterID
    - dateTime
    - dateTimeStart
    - dateTimeEnd
    - type
    - typeOther
    - collection
    - collectionOther
    - preTreatment
    - preTreatmentDescription
    - pooled
    - children
    - parent
    - sizeL
    - fieldSampleTempC
    - shippedOnIce
    - storageTempC
    - qualityFlag
    - notes
    slot_usage:
      sampleID:
        description: Unique identifier for sample. Suggestion:siteID-date-index.
        title: Sample id
        identifier: true
        range: string
      siteID:
        description: Links with the Site table to describe the location of sampling.
        title: Site id
        range: Site
      instrumentID:
        description: Links with the Instrument table to describe the instrument used
          for sampling.
        title: Instrument id
        range: Instrument
      reporterID:
        description: Links with the reporter table to identify the reporter who collected
          the sample.
        title: reporter ID
        range: Reporter
      dateTime:
        description: for grab samples this is the date, time and timezone the sample
          was taken.
        title: Date time
        range: datetime
      dateTimeStart:
        description: For integrated time averaged samples this is the date, time and
          timezone the sample was started being taken.
        title: Date time start
        range: datetime
      dateTimeEnd:
        description: For integrated time average samples this is the date, time and
          timezone the sample was finished being taken.
        title: Date time end
        range: datetime
      type:
        description: Type of sample.
        title: Type
        range: SampleType
      typeOther:
        description: Description for other type of sample not listed in
        title: Type other
        range: string
      collection:
        description: Method used to collect the sample.
        title: Collection
        range: SampleCollection
      collectionOther:
        description: Description for other type of method not listed in collection.
        title: Collection other
        range: string
      preTreatment:
        description: Was the sample chemically treated in anyway with the addition
          of stabilizers or other
        title: Pre treatment
        range: boolean
      preTreatmentDescription:
        description: If preTreatment then describe the treatment that was performed.
        title: Pre treatment description
        range: string
      pooled:
        description: Is this a pooled sample, and therefore composed of multiple child
          samples obtained at different sites
        title: Pooled
        range: boolean
      children:
        description: If this is a sample with many smaller samples either because
          of pooling or sub-sampling this indicates a comma separated list of child
          sampleID's.
        title: Children
        range: string
      parent:
        description: If this sample has been pooled into one big sample for analysis
          this indicates the sampleID of the larger pooled sample.
        title: Parent
        range: string
      sizeL:
        description: Total volume of water or sludge sampled.
        title: Size l
        range: float
        unit:
          ucum_code: L
      fieldSampleTempC:
        description: Temperature that the sample is stored at while it is being sampled.
          This field is mainly relevant for composite samples which are either kept
          at ambient temperature or refrigerated while being sampled.
        title: Field sample temp c
        range: float
        unit:
          ucum_code: Cel
      shippedOnIce:
        description: Was the sample kept cool while being shipped to the lab
        title: Shipped on ice
        range: boolean
      storageTempC:
        description: Temperature that the sample is stored at in Celsius.
        title: Storage temp c
        range: float
        unit:
          ucum_code: Cel
      qualityFlag:
        description: Does the reporter suspect the sample having some quality issues
        title: Quality flag
        range: boolean
      notes:
        description: Any additional notes.
        title: Notes
        range: string
  WWMeasure:
    description: Measurement result (ie. single variable) from a wastewater sample.
      WWMeaasure includes data that is commonly collected by staff at wastewater laboratories
      where measurement is performed using an assay method (see AssayMethod), but
      can also be performed using specific instruments (see Instruments. Measures
      performed at the site of the wastewater sample are reported in SiteMeasure.
    title: Wastewater measurement data
    slots:
    - uWwMeasureID
    - wwMeasureID
    - sampleID
    - labID
    - assayID
    - instrumentID
    - reporterID
    - analysisDate
    - reportDate
    - fractionAnalyzed
    - type
    - typeOther
    - unit
    - unitOther
    - aggregation
    - aggregationOther
    - index
    - value
    - qualityFlag
    - accessToPublic
    - accessToAllOrg
    - accessToSelf
    - accessToPHAC
    - accessToLocalHA
    - accessToProvHA
    - accessToOtherProv
    - accessToDetails
    - notes
    slot_usage:
      uWwMeasureID:
        description: Unique identifier a measurement within the measurement table.
        title: U ww measure id
        identifier: true
        range: string
      wwMeasureID:
        description: 'Unique identifier for wide table only. Use when all measures
          are performed on a single sample at the same time and same laboratory. Suggestion:
          siteID_sampleID_LabID_reportDate_ID.'
        title: Ww measure id
        range: string
      sampleID:
        description: Links with the identified Sample
        title: Sample id
        range: Sample
      labID:
        description: Links with the identified Lab that performed the analysis.
        title: Lab id
        range: Lab
      assayID:
        description: Links with the AssayMethod used to perform the analysis. Use
          instrument.ID for measures that are not viral measures.
        title: Assay id
        range: AssayMethod
      instrumentID:
        description: Links with the Instrument used to perform the analysis. Use assay.ID
          for viral measures.
        title: Instrument id
        range: Instrument
      reporterID:
        description: Links with the reporter that is responsible for the data.
        title: Reporter id
        range: Reporter
      analysisDate:
        description: date the measurement was performed in the lab.
        title: Analysis date
        range: date
      reportDate:
        description: date the data was reported. One sampleID may have updated reports
          based on updates to assay method or reporting standard. In this situation,
          use the original sampleID but updated MeasureID, reportDate and assayID
          (if needed).
        title: Report date
        range: date
      fractionAnalyzed:
        description: Fraction of the sample that is analyzed.
        title: Fraction analyzed
        range: WWMeasureFractionAnalyzed
      type:
        description: The variable that is being measured on the sample, e.g. a SARS-CoV-2
          gene target region (cov), a biomarker for normalisation (n) or a water quality
          parameter (wq).
        title: Type
        range: WWMeasureType
      typeOther:
        description: Description for an other variable not listed in category.
        title: Type other
        range: string
      unit:
        description: Unit of the measurement.
        title: Unit
        range: WWMeasureUnit
      unitOther:
        description: Description for other measurement unit not listed in unit.
        title: Unit other
        range: string
      aggregation:
        description: Statistical measures used to report the sample units of Ct/Cq,
          unless otherwise stated. Each aggregation has a corresponding value.
        title: Aggregation
        range: WWMeasureAggregation
      aggregationOther:
        description: Description for other type of aggregation not listed in aggregation.
        title: Aggregation other
        range: string
      index:
        description: Index number in case the measurement was taken multiple times.
        title: Index
        range: integer
      value:
        description: The actual value that is being reported for this measurement.
          Use "NA" for missing values and make sure to leave a note.
        title: Value
        range: float
      qualityFlag:
        description: Does the reporter suspect the measurement having some quality
          issues
        title: Quality flag
        range: boolean
      accessToPublic:
        description: If this is 'no', this data will not be available to the public.
          If missing, data will be available to the public.
        title: Access to public
        range: boolean
      accessToAllOrg:
        description: If this is 'no', this data will not be available to any partner
          organization. If missing, data will be available to the all organizations.
        title: Access to all org
        range: boolean
      accessToSelf:
        description: If this is 'no', this data will not be shown on the portal when
          this reporter logs in. If missing, data will be available to this reporter.
        title: Access to self
        range: boolean
      accessToPHAC:
        description: If this is 'no', the data will not be available to employees
          of the Public Health Agency of Canada - PHAC. If missing, data will be available
          to employees of the Public Health Agency of Canada - PHAC.
        title: Access to phac
        range: boolean
      accessToLocalHA:
        description: If this is 'no', the, data will not be available to local health
          authorities. If missing, data will be available to local health authorities.
        title: Access to local ha
        range: boolean
      accessToProvHA:
        description: If this is 'no', this data will not be available to provincial
          health authorities. If missing, data will be available to provincial health
          authorities.
        title: Access to prov ha
        range: boolean
      accessToOtherProv:
        description: If this is 'no', this data will not be available to other data
          providers not listed before. If missing, data will be available to other
          data providers not listed before
        title: Access to other prov
        range: boolean
      accessToDetails:
        description: More details on the existing confidentiality requirements of
          this measurement.
        title: Access to details
        range: boolean
      notes:
        description: Any additional notes.
        title: Notes
        range: string
  Site:
    description: The site of wastewater sampling, including several defaults that
      can be used to populate new samples upon creation.
    title: site of sample
    slots:
    - siteID
    - name
    - description
    - publicHealthDepartment
    - healthRegion
    - type
