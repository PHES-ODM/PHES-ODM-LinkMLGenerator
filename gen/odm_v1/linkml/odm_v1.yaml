name: ODMv1
description: Data model for the Public Health Environmental Surveillance Open Data
  Model, version 1
id: https://onto.phes-odm.org/odm/v1
imports:
- linkml:types
prefixes:
  odmv1: https://onto.phes-odm.org/odm/v1/
  linkml: https://w3id.org/linkml/
default_prefix: odmv1
default_range: string
enums:
  SampleType:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      rawWW:
        description: Raw wastewater.
      swrSed:
        description: Sediments obtained in sewer.
      pstGrit:
        description: Raw wastewater after a treatment plant's headworks.
      pSludge:
        description: Sludge produced by primary clarifiers.
      pEfflu:
        description: Effluent obtained after primary clarifiers.
      sSludge:
        description: Sludge produced by secondary clarifiers.
      sEfflu:
        description: Effluent obtained after secondary clarifiers.
      water:
        description: Non-wastewater, coming from any kind of water body.
      faeces:
        description: Fecal matter.
      other:
        description: Other type of site. Add description to typeOther.
  SampleCollection:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      cpTP24h:
        description: A time proportional 24-hour composite sample generally collected
          by an autosampler.
      cpFP24h:
        description: A flow proportional 24-hour composite sample generally collected
          by an autosampler.
      grb:
        description: A single large representative grab sample.
      grbCp8h:
        description: A 8-hour composite with 8 grab samples each taken once per hour,
          generally manually performed.
      grbCp3h:
        description: A 3-hour composite with 3 grab samples each taken once per hour,
          generally manually performed.
      grbCp3:
        description: A grab-composite sample composed of 3 separate grab samples.
      mooreSw:
        description: Moore swab passive sample.
      other:
        description: Other type of collection method. Add description to collectionOther.
  WWMeasureFractionAnalyzed:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      liquid:
        description: Liquid fraction
      solid:
        description: Solid fraction
      mixed:
        description: Mixed/homogenized sample
  WWMeasureType:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      covN1:
        description: SARS-CoV-2 nucleocapsid gene N1
      covN2:
        description: SARS-CoV-2 nucleocapsid gene N2
      covN3:
        description: SARS-like coronaviruses nucleocapsid gene N3
      covE:
        description: SARS-CoV-2 gene region E
      varB117:
        description: Variant B.1.1.7
      varB1351:
        description: Variant B.1.351
      varP1:
        description: Variant P.1
      covRdrp:
        description: SARS-CoV-2 gene region RdRp
      nPMMoV:
        description: Pepper mild mottle virus
      ncrA:
        description: cross-assembly phage
      nbrsv:
        description: bovine respiratory syncytial virus
      wqTS:
        description: Total solids concentration.
      wqTSS:
        description: Total suspended solids concentration.
      wqVSS:
        description: Volatile suspended solids concentration.
      wqCOD:
        description: Chemical oxygen demand.
      wqOPhos:
        description: Ortho-phosphate concentration.
      wqNH4N:
        description: Ammonium nitrogen concentration, as N.
      wqTN:
        description: Total nitrogen concentration, as N.
      wqPh:
        description: pH
      wqCond:
        description: Conductivity
      temp:
        description: temperature of the sample when the measurement is taken, often
          when it arrives at the lab.
      other:
        description: Other measurement category. Add description to categoryOther.
  WWMeasureUnit:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      gcPMMoV:
        description: Gene or variant copies per copy of PMMoV.
      gcMl:
        description: Gene or variant copies per milliliter.
      gcGs:
        description: Gene or variant copies per gram solids.
      gcL:
        description: Gene or variant copies per liter.
      gcCrA:
        description: Gene or variant copies per copy of crAssphage.
      Ct:
        description: Cycle threshold.
      mgL:
        description: Milligrams per liter.
      ph:
        description: pH units
      uScm:
        description: Micro-siemens per centimeter.
      detected:
        description: Gene copies or variant detected in the sampleGene or variant
          copiesDetected = 1Gene or variant copiesNot detected = 0.
      propVar:
        description: Proportion of variant in sample
      pp:
        description: Percent positive, for Moore swab.
      pps:
        description: Percent primary sludge, for total solids.
      c:
        description: temperature in celsius
      bool:
        description: In cases where a boolean yes or no is required use bool
      other:
        description: Other measurement of viral copies or wastewater treatment plant
          parameter. Add description to UnitOther.
  WWMeasureAggregation:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      single:
        description: This value is not an aggregate measurement in any way (ie. not
          a mean, median, max or any other) and can be a replicate value.
      mean:
        description: Arithmetic mean
      meanNr:
        description: Arithmetic mean, normalized
      geoMn:
        description: Geometric mean
      geoMnNr:
        description: Geometric mean, normalized
      median:
        description: Median
      min:
        description: Lowest value in a range of values
      max:
        description: Highest value in a range of values
      sd:
        description: Standard deviation
      sdNr:
        description: Standard deviation, normalized
      other:
        description: Other aggregation method. Add description to aggregationOther
  SiteType:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      airPln:
        description: Airplane.
      corFcil:
        description: Correctional facility.
      school:
        description: School
      hosptl:
        description: Hospital
      ltcf:
        description: Long-term care facility.
      swgTrck:
        description: Sewage truck.
      uCampus:
        description: University campus.
      mSwrPpl:
        description: Major sewer pipeline.
      pStat:
        description: Pumping station.
      holdTnk:
        description: Hold tank.
      retPond:
        description: Retention pond.
      wwtpMuC:
        description: Municipal wastewater treatment plant for combined sewage.
      wwtpMuS:
        description: Municipal wastewater treatment plant for sanitary sewage only.
      wwtpInd:
        description: Industrial wastewater treatment plant.
      lagoon:
        description: Logoon system for extensive wastewater treatment.
      septTnk:
        description: Septic tank.
      river:
        description: River, natural water body.
      lake:
        description: Lake, natural water body.
      estuary:
        description: Estuary, natural water body
      sea:
        description: Sea, natural water body.
      ocean:
        description: Ocean, natural water body.
      other:
        description: Other site type. Add description to typeOther.
  SiteSampleTypeDefault:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      rawWW:
        description: Raw wastewater.
      swrSed:
        description: Sediments obtained in sewer.
      pstGrit:
        description: Raw wastewater after a treatment plant's headworks.
      pSludge:
        description: Sludge produced by primary clarifiers.
      pEfflu:
        description: Effluent obtained after primary clarifiers.
      sSludge:
        description: Sludge produced by secondary clarifiers.
      sEfflu:
        description: Effluent obtained after secondary clarifiers.
      water:
        description: Non-wastewater, coming from any kind of water body.
      faeces:
        description: Fecal matter.
      other:
        description: Other type of site. Add description to typeOther.
  SiteSampleCollectionDefault:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      cpTP24h:
        description: A time proportional 24-hour composite sample generally collected
          by an autosampler.
      cpFP24h:
        description: A flow proportional 24-hour composite sample generally collected
          by an autosampler.
      grb:
        description: A single large representative grab sample.
      grbCp8h:
        description: An 8-hour composite with 8 grab samples each taken once per hour,
          generally manually performed.
      grbCp3h:
        description: A 3-hour composite with 3 grab samples each taken once per hour,
          generally manually performed.
      grbCp3:
        description: A grab-composite sample composed of 3 separate grab samples.
      mooreSw:
        description: Moore swab passive sample.
      other:
        description: Other type of collection method. Add description to collectionOther.
  SiteMeasureFractionAnalyzedDefault:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      liquid:
        description: Liquid fraction
      solid:
        description: Solid fraction
      mixed:
        description: Mixed/homogenized sample
  SiteMeasureType:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      envTemp:
        description: Environmental temperature.
      envRnF:
        description: Rain fall, i.e. amount of precipitation in the form of rain.
      envSnwF:
        description: Snow fall, i.e. amount of precipitation in the form of snow.
      envSnwD:
        description: Total depth of snow on the ground.
      wwFlow:
        description: Flow of wastewater.
      wwTemp:
        description: Temperature of the wastewater.
      wwTSS:
        description: Total suspended solids concentration of the wastewater.
      wwCOD:
        description: Chemical oxygen demand of the wastewater.
      wwTurb:
        description: Turbidity of the wastewater.
      wwOPhos:
        description: Ortho-phosphate concentration.
      wwNH4N:
        description: Ammonium nitrogen concentration, as N.
      wwTN:
        description: Total nitrogen concentration, as N.
      wwPh:
        description: pH of the wastewater.
      wwBOD5t:
        description: 5 day total biochemical oxygen demand
      wwBOD5c:
        description: 5 day carbonaceous biochemical oxygen demand
      wwPtot:
        description: Total phosphates
      wwPP:
        description: Total phosphorous
      wwCond:
        description: Conductivity of the wastewater.
  SiteMeasureUnit:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      c:
        description: Degrees Celcius
      mm:
        description: Millimeters
      m3H:
        description: Cubic meters per hour
      m3D:
        description: Cubic meters per day
      m3S:
        description: Not Available
      mgL:
        description: Milligrams per liter
      pH:
        description: pH units
      uScm:
        description: Micro-siemens per centimeter
  SiteMeasureAggregation:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      single:
        description: This value is not an aggregate measurement in any way (ie. not
          a mean, median, max or any other) and can be a replicate value.
      mean:
        description: Arithmetic mean
      geoMn:
        description: Geometric mean
      median:
        description: Median
      min:
        description: Lowest value in a range of values
      max:
        description: Highest value in a range of values
      sd:
        description: Standard deviation
      other:
        description: Other aggregation method. Add description to aggregationOther
  AssayMethodUnit:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      gcPMMoV:
        description: Gene copies per copy of PMMoV.
      gcMl:
        description: Gene copies per milliliter.
      gcGms:
        description: Gene copies per gram solids.
      gcL:
        description: Gene copies per liter.
      gcCrA:
        description: Gene copies per copy of crAssphage.
      other:
        description: Other measurement of viral copies. Add description to unitOther.
  InstrumentType:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      online:
        description: An online sensor
      lab:
        description: Offline laboratory analysis
      hand:
        description: A handheld measurement analyzer.
      atline:
        description: An atline analyzer with sampler.
      other:
        description: An other type of measurement instrument. Add description to instrumentTypeOther.
  PolygonType:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      swrCat:
        description: Sewer catchment area.
      hlthReg:
        description: Health region served by the sewer network
  CovidPublicHealthDataType:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      conf:
        description: Number of confirmed cases. This measure should be accompanied
          by dateType.
      active:
        description: Number of active cases.
      test:
        description: Number of tests performed.
      posTest:
        description: Number of positive tests.
      pPosRt:
        description: Percent positivity rate.
      hospCen:
        description: Hospital census or the number of people admitted with covid-19.
      hospAdm:
        description: Hospital admissions or patients newly admitted to hospital.
  CovidPublicHealthDataDateType:
    from_schema: https://onto.phes-odm.org/odm/v1
    permissible_values:
      episode:
        description: Episode date is the earliest of onset, test or reported date.
      onset:
        description: Earliest that symptoms were reported for this case. This data
          is often not known and reported. In lieu, episode is used.
      report:
        description: Date that the numbers were reported publicly. Typically, reported
          data and this measure is most commonly reported and used.
      test:
        description: Date that the covid-19 test was performed.
