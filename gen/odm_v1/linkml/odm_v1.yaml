    - reporterID
    - polygonID
    - date
    - type
    - dateType
    - value
    - notes
    slot_usage:
      cphdID:
        description: Unique identifier for the table.
        title: Cphd id
        identifier: true
        range: string
      reporterID:
        description: ID of the reporter who gave this data.
        title: Reporter id
        range: Reporter
      polygonID:
        description: Links with the Polygon table.
        title: Polygon id
        range: Polygon
      date:
        description: date of reporting for covid-19 measure.
        title: Date
        range: string
      type:
        description: Type of covid-19 patient data.
        title: Type
        range: CovidPublicHealthDataType
      dateType:
        description: Type of date used for conf cases. Typically report or episode
          are reported. onset and test date is not usually reported within aggregate
          data.
        title: Date type
        range: CovidPublicHealthDataDateType
      value:
        description: The actual value that is being reported for this measurement.
          Use "NA" for missing values and make sure to leave a note.
        title: Value
        range: float
      notes:
        description: Any additional notes.
        title: Notes
        range: string
