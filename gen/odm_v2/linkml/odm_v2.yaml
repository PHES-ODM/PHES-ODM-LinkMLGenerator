  countries:
    description: Look up table for the possible country inputs.
    title: Countries look-up tables
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - isoCode
    - isoCodeX
    - numCode
    - tld
    - nameEngl
    - nameOfficial
    - sovereignty
    - countryExonym
    - capitalExonym
    - countryEndonym
    - capitalEndonym
    - langScript
    - phone
    - utc
    - utcDST
    slot_usage:
      isoCode:
        description: The ISO 3166-1 alpha-2 code, a two-letter country code which
          is also used to create the ISO 3166-2 country subdivision code and the Internet
          country code top-level domain.
        title: ISO 3166-1 alpha-2 country code
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        identifier: true
        range: string
        required: true
        pattern: ^.{2,2}$
      isoCodeX:
        description: The ISO 3166-1 alpha-3 code, a three-letter country code which
          may allow a better visual association between the code and the country names
          than the 3166-1 alpha-2 code.
        title: ISO 3166-1 alpha-3 country code
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{3,3}$
      numCode:
        description: The ISO 3166-1 numeric code, a three-digit country code which
          is identical to that developed and maintained by the United Nations Statistics
          Division, with the advantage of script (writing system) independence, and
          hence useful for people or systems using non-Latin scripts.
        title: ISO 3166-1 numeric country code
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{3,3}$
      tld:
        description: The internet top-level domain generally used or reserved for
          a country, sovereign state, or dependent territory identified with a country
          code.
        title: Country code top-level domain
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{3,3}$
      nameEngl:
        description: English-language name of a given country.
        title: English name for countries
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      nameOfficial:
        description: Official english-language name of a given state.
        title: Official state name
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      sovereignty:
        description: Sovereign status of a country, indicating which state has the
          highest jurisdiction over a given territory.
        title: Sovereign status of a country
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,50}$
      countryExonym:
        description: The English name foreigners use for the country.
        title: Country exonym
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      capitalExonym:
        description: "The English name foreigners use for the country\u2019s capital."
        title: Capital city exonym
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      countryEndonym:
        description: The name locals use for their country.
        title: Country endonym
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      capitalEndonym:
        description: "The name locals use for their country\u2019s capital."
        title: Capital city endonym
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      langScript:
        description: "The language(s) and script(s) used for the country\u2019s capital\
          \ endonyms."
        title: National language script
        notes:
        - The scripts are listed in parenthesis, in the order of their appearance.
          Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      phone:
        description: International dialing code for the country.
        title: Country national phone prefix
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      utc:
        description: "UTC \u2013 Time zone."
        title: Coordinated universal time (UTC) zone
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
      utcDST:
        description: Time zone during Daylight Saving Time.
        title: Coordinated universal time (UTC) zone in daylight savings
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        range: string
        required: true
        pattern: ^.{0,75}$
