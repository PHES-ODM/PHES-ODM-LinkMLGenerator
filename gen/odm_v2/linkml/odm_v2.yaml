classes:
  wideNames:
    description: The table for wide names.
    title: Wide name table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - wideName
    - label
    - charLength
    - descr
    - source
    - wideMeasure
    - wideProtocol
    - wideAttribute
    - wideNameType
    - reportTableName
    - reportTableInput
    - partTypeName
    - partTypeInput
    - compartmentName
    - compartmentInput
    - specimenName
    - specimenInput
    - fractionName
    - fractionInput
    - measureName
    - measureInput
    - methodName
    - methodInput
    - unitName
    - unitInput
    - aggregationName
    - aggregationInput
    - index
    - attributeName
    - attributeInput
    slot_usage:
      wideName:
        description: 'Unique identifier for wide table only. Use when all measures
          are performed on a single sample at the same time and same laboratory. Suggestion:
          siteID_sampleID_LabID_reportDate_ID.'
        title: Wide Name
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      label:
        description: A human readable label of a part.
        title: Label
        notes:
        - Typically, a part label has no acrynomns (every word is spelled out). Equivalent
          to a LOINC common name.
        range: string
        required: true
        pattern: ^.{0,30}$
      charLength:
        description: The number of characters used for the wide names.
        title: character length
        range: string
        pattern: ^.{0,30}$
      descr:
        description: A detailed description of a measure, method, or attribute.
        title: Description
        notes:
        - A description of the part that serves a clear presentation of the part to
          a wide audience including techinical and not techincal staff. A description
          should allow any person who generates environment surveillance data to know
          how to identify how to record their data elements in the ODM. partReference
          can be used to further describe a part.
        range: string
        required: true
        pattern: ^.{0,200}$
      source:
        description: The database or table sourced for the wide name.
        title: Wide name source
        range: string
        required: true
        pattern: ^.{0,30}$
      wideMeasure:
        description: Unique identifier for a measure in a wide table only.
        title: Measure identification (wide table)
        range: string
        pattern: ^.{0,30}$
      wideProtocol:
        description: Unique identifier for a protocol in a wide table only.
        title: Specified protocol (wide table)
        range: string
        pattern: ^.{0,30}$
      wideAttribute:
        description: Unique identifier for an attribute in a wide table only.
        title: Specified attribute (wide table)
        range: string
        pattern: ^.{0,30}$
      wideNameType:
        description: The type of wide name generated. Possible options are measure,
          protocol or attribute.
        title: Wide name type
        range: string
        pattern: ^.{0,30}$
      reportTableName:
        description: The report table that the wide name calls from.
        title: Report table name (wide table)
        range: string
        pattern: ^.{0,30}$
      reportTableInput:
        description: The short name for the listed source table.
        title: Report table input (wide table)
        range: string
        pattern: ^.{0,30}$
      partTypeName:
        description: The part type being used in a wide name.
        title: Part type name (wide table)
        range: string
        pattern: ^.{0,30}$
      partTypeInput:
        description: The partID for the part type being used in a wide name.
        title: Part type input (wide table)
        range: string
        pattern: ^.{0,30}$
      compartmentName:
        description: The compartment referenced for the wide name.
        title: Compartment name (wide table)
        range: string
        pattern: ^.{0,30}$
      compartmentInput:
        description: The partID for the compartment being used in a wide name.
        title: Compartment input (wide table)
        range: string
        pattern: ^.{0,30}$
      specimenName:
        description: The specimen referenced for the wide name.
        title: Specimen name (wide table)
        range: string
        pattern: ^.{0,30}$
      specimenInput:
        description: The partID for the specimen being used in a wide name.
        title: Specimen input (wide table)
        range: string
        pattern: ^.{0,30}$
      fractionName:
        description: The fraction analyzed referenced for the wide name.
        title: Fraction name (wide table)
        range: string
        pattern: ^.{0,30}$
      fractionInput:
        description: The partID for the fraction being used in a wide name.
        title: Fraction input (wide table)
        range: string
        pattern: ^.{0,30}$
      measureName:
        description: The measure referenced for the wide name.
        title: Measure name (wide table)
        range: string
        pattern: ^.{0,30}$
      measureInput:
        description: The partID for the measure being used in a wide name.
        title: Measure input (wide table)
        range: string
        pattern: ^.{0,30}$
      methodName:
        description: The method referenced for the wide name.
        title: Method name (wide table)
        range: string
        pattern: ^.{0,30}$
      methodInput:
        description: The partID for the method being used in a wide name.
        title: Method input (wide table)
        range: string
        pattern: ^.{0,30}$
      unitName:
        description: The unit referenced for the wide name.
        title: Unit name (wide table)
        range: string
        pattern: ^.{0,30}$
      unitInput:
        description: The partID for the unit being used in a wide name.
        title: Unit input (wide table)
        range: string
        pattern: ^.{0,30}$
      aggregationName:
        description: The aggregation referenced for the wide name.
        title: Aggregation name (wide table)
        range: string
        pattern: ^.{0,30}$
      aggregationInput:
        description: The partID for the aggregation being used in a wide name.
        title: Aggregation input (wide table)
        range: string
        pattern: ^.{0,30}$
      index:
        description: Index number in case the measurement was taken multiple times.
        title: Index
        range: string
        pattern: ^.{0,50}$
      attributeName:
        description: The attribute referenced for the wide name.
        title: Attribute name (wide table)
        range: string
        pattern: ^.{0,30}$
      attributeInput:
        description: The partID for the attribute being used in a wide name.
        title: Attribute input (wide table)
        range: string
        pattern: ^.{0,30}$
  organizations:
    description: The table that contains information about a laboratory.
    title: Organization table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - organizationID
    - name
    - descr
    - addressID
    - datasetID
    - orgType
    - orgLevel
    - orgSector
    - lastEdited
    - notes
    slot_usage:
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
        identifier: true
        range: string
        required: true
        pattern: ^.{0,100}$
      name:
        description: Name of a domain, specimen, group, class, attribute, unit, nomeclature
          or other entity.
        title: Name
        notes:
        - Name of any entity. Use a prefix to distinguish names from different report
          tables. See fully specified name (FSN) list.  i.e. Si-name = Site name,
          Po-name = Polygon name, Or-name = Organization name, Me-name = Method-name.
        range: string
        pattern: ^.{0,30}$
      descr:
        description: A detailed description of a measure, method, or attribute.
        title: Description
        notes:
        - A description of the part that serves a clear presentation of the part to
          a wide audience including techinical and not techincal staff. A description
          should allow any person who generates environment surveillance data to know
          how to identify how to record their data elements in the ODM. partReference
          can be used to further describe a part.
        range: string
        pattern: ^.{0,200}$
      addressID:
        description: A unique identifier for an address.
        title: Address ID
        range: addresses
        required: true
        pattern: ^.{0,30}$
      datasetID:
        description: The name of the dataset that stores information for MeasureReport,
          SampleReport and other reporting tables.
        title: Dataset ID
        notes:
        - Where possible, datasetID name should correspond the orignial data custodian
          responsible for generating environmental data. (suggestion for a default
          name convention.)
        range: datasets
        pattern: ^.{0,30}$
      orgType:
        description: Specifies the type or purpose of a given organization.
        title: Organization Type
        range: orgTypeSet
        pattern: ^.{0,30}$
      orgLevel:
        description: The geographic level of an organization.
        title: Organization level
        notes:
        - There are six levels based on International Standard Classification of Administrative
          Units (ISCU).
        range: orgLevelSet
        pattern: ^.{0,30}$
      orgSector:
        description: The sector of an organization
        title: Organization sector
        range: orgSectorSet
        pattern: ^.{0,30}$
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
  qualityReports:
    description: The table for recording the various quality metrics and indicators
      for samples and measures.
    title: Quality reports table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - qualityReportID
    - measureRepID
    - sampleID
    - measureSetRepID
    - qualityFlag
    - severity
    - lastEdited
    - notes
    slot_usage:
      qualityReportID:
        description: A unique identifier for a given quality report.
        title: Quality report ID
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      measureRepID:
        description: Unique identifier for a measurement.
        title: Report ID
        notes:
        - Report IDs cannot be repeated.
        range: measures
        pattern: ^.{0,30}$
      sampleID:
        description: Unique identifier for a sample.
        title: Sample ID
        notes:
        - Suggestion:siteID-date-index.
        range: samples
        pattern: ^.{0,30}$
      measureSetRepID:
        description: Unique identifier that links together a group of related measures.
        title: Measure set report set ID
        range: measureSets
        pattern: ^.{0,30}$
      qualityFlag:
        description: A field for reporting any quality concerns - of lack thereof
          - for a sample or measure.
        title: Quality flag
        notes:
        - Types of quality flag vary on context; please see the qulaityFlagSet to
          be confirm.
        range: qualityIndicators
        required: true
        pattern: ^.{0,30}$
      severity:
        description: An indicator of the severity or seriousness of a quality flag.
        title: Severity indicator
        range: sevSet
        pattern: ^.{0,30}$
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
  translations:
    description: Look up table for translations of the description, label, and instruction
      for all parts.
    title: Translation look-up table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - translationID
    - lang
    - partID
    - label
    - partDesc
    - partInstr
    - firstReleased
    - lastUpdated
    - changes
    - notes
    slot_usage:
      translationID:
        description: A unique, autoincremental ID generated to produce a unique identifier
          and primary key for each row of the translations table.
        title: Synthetic ID for the translations table
        identifier: true
        range: string
        required: true
        pattern: ^.{0,50}$
      lang:
        description: Language code for translation purposes. Specifies the langage
          for each translation, other than the default English. Uses the ISO-6393
          code.
        title: Language ID
        notes:
        - Follow the ISO639-3 codes for now.
        range: languages
        required: true
        pattern: ^.{0,30}$
      partID:
        description: The unique identify of any entity within the dictionary.
        title: Part identifier
        notes:
        - Every entity in the ODM has a partID. The partID must be unique with no
          duplcates. partIDs are short. partIDs that are constructed by different
          part attributes can be up 28 characters (check max), but each part attibute
          should be 1 to 5 characters. partIDs are machine readible, but a knowledgable
          user can understand what they represent. partID are used, for example, as
          a header in an Excel input table. Numbers are allowed but there no other
          special characters other than `_`. `_` is a reserved character that is used
          to generate a partID using a compoent or table attributes. A partID for
          a subComponent is automatically generated using attributes of a component.
          For example, the partID for the compoent `SARS-CoV-2` is `covid`. `Covid`
          can have many subComponents including different groups (Covid-19-al, Covid-19-va,
          ovid-pr (allele, variant or protein) or units and aggregatrions (i.e. covid-al-N1-mean-cpl
          representing ovid allele N1, mean observation of viral copies per litre
          of effluent). A similar approach to naming subComponent is use for naming
          parts in a reprotTable.
        range: parts
        required: true
        pattern: ^.{0,28}$
      label:
        description: A human readable label of a part.
        title: Label
        notes:
        - Typically, a part label has no acrynomns (every word is spelled out). Equivalent
          to a LOINC common name.
        range: string
        required: true
        pattern: ^.{0,30}$
      partDesc:
        description: The description of the part.
        title: Part description
        notes:
        - Provides description of the part, used for tranlsation.
        range: string
        required: true
        pattern: ^.{0,30}$
      partInstr:
        description: Additional notes and instructions on how a part is used and/or
          defined.
        title: Part instruction
        range: string
        pattern: ^.{0,200}$
      firstReleased:
        description: The version in which a part was first released
        title: First released version
        range: string
        required: true
        pattern: ^.{0,30}$
      lastUpdated:
        description: The version in which the part was last updated.
        title: Last updated version
        notes:
        - Any change to the part of list will result in a change in the lastUpdated
          field to the dictionary version where the update occurred.
        range: string
        required: true
        pattern: ^.{0,30}$
      changes:
        description: A column for recording the changes from a previous version.
        title: Changes column
        notes:
        - Use this column as a short-hand change log for dictionary development.
        range: string
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
  languages:
    description: Look up table for all languages, used to give structure to the translation
      table.
    title: Language Look-up table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - lang
    - langFam
    - langName
    - natName
    - iso6391
    - iso6392B
    - iso6392T
    - iso6393
    - iso6396
    - firstReleased
    - lastUpdated
    - changes
    - notes
    slot_usage:
      lang:
        description: Language code for translation purposes. Specifies the langage
          for each translation, other than the default English. Uses the ISO-6393
          code.
        title: Language ID
        notes:
        - Follow the ISO639-3 codes for now.
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      langFam:
        description: Specifies the language family of a given language for translation
          and language tracking purposes.
        title: Language family
        notes:
        - Part of the metedata for a languageID.
        range: string
        required: true
        pattern: ^.{0,30}$
      langName:
        description: Specifies the name of the language in roman alphabet characters
          for translation and language tracking purposes.
        title: Language name
        notes:
        - Part of the metedata for a languageID.
        range: string
        required: true
        pattern: ^.{0,30}$
      natName:
        description: The native name of the language, i.e. what the language is called
          by its speakers.
        title: Native Name
        notes:
        - Part of the metedata for a languageID.
        range: string
        required: true
        pattern: ^.{0,30}$
      iso6391:
        description: The first part of the ISO 639 series of international standards
          for language codes. Part 1 covers the registration of two-letter codes.
          There are 183 two-letter codes registered as of June 2021. The registered
          codes cover the world's major languages.
        title: ISO639-1
        notes:
        - Part of the metedata for a languageID.
        range: string
        required: true
        pattern: ^.{0,30}$
      iso6392B:
        description: A set of international standards that lists short codes for language
          names. These ISO639-2 are the three-letter codes defined in part two (ISO
          639-2) of the standard, including the corresponding two-letter (ISO 639-1)
          codes where they exist. The 'B' specifies the bibliographic code (B code).
        title: ISO639-2B
        notes:
        - Part of the metedata for a languageID.
        range: string
        required: true
        pattern: ^.{0,30}$
      iso6392T:
        description: A set of international standards that lists short codes for language
          names. These ISO639-2 are the three-letter codes defined in part two (ISO
          639-2) of the standard, including the corresponding two-letter (ISO 639-1)
          codes where they exist. The 'T' specifies the terminological code (T code).
        title: ISO639-2T
        notes:
        - Part of the metedata for a languageID.
        range: string
        required: true
        pattern: ^.{0,30}$
      iso6393:
        description: A set of international standards that lists short codes for language
          names. ISO 639-3 extends the ISO 639-2 alpha-3 codes with an aim to cover
          all known natural languages.
        title: ISO639-3
        notes:
        - Part of the metedata for a languageID.
        range: string
        required: true
        pattern: ^.{0,30}$
      iso6396:
        description: A set of international standards that lists short codes for language
          names. ISO 639-6 builds off ISO639-3 with the use of four-letter codes,
          and allowing users to differenciate between variants of languages and language
          families, such as histroical vs. revived versions of languages.
        title: ISO639-6
        notes:
        - Part of the metedata for a languageID.
        range: string
        required: true
        pattern: ^.{0,30}$
      firstReleased:
        description: The version in which a part was first released
        title: First released version
        range: string
        required: true
        pattern: ^.{0,30}$
      lastUpdated:
        description: The version in which the part was last updated.
        title: Last updated version
        notes:
        - Any change to the part of list will result in a change in the lastUpdated
          field to the dictionary version where the update occurred.
        range: string
        required: true
        pattern: ^.{0,30}$
      changes:
        description: A column for recording the changes from a previous version.
        title: Changes column
        notes:
        - Use this column as a short-hand change log for dictionary development.
        range: string
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
