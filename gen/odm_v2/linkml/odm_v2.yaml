        - Name of any entity. Use a prefix to distinguish names from different report
          tables. See fully specified name (FSN) list.  i.e. Si-name = Site name,
          Po-name = Polygon name, Or-name = Organization name, Me-name = Method-name.
        range: string
        pattern: ^.{0,30}$
      model:
        description: Model number or version of the instrument.
        title: Model
        range: string
        required: true
        pattern: ^.{0,100}$
      manufacturer:
        description: Manufacturer of an instrument.
        title: Manufacturer
        range: string
        pattern: ^.{0,100}$
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
        range: contacts
        pattern: ^.{0,30}$
      organizationID:
