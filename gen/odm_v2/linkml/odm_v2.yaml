        title: Index
        range: string
        pattern: ^.{0,50}$
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
  sites:
    description: The table that contains information about a site; the location where
      an environmental sample was taken.
    title: Sites table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - parSiteID
    - siteID
    - datasetID
    - polygonID
    - siteType
    - sampleShed
    - addressID
    - organizationID
    - contactID
    - name
    - descr
    - repOrg1
    - repOrg2
    - healthRegion
    - geoLat
    - geoLong
    - geoEPSG
    - lastEdited
    - notes
    slot_usage:
      parSiteID:
        description: The siteID that is a parent to another siteID; usually the sub-site
          will be contained in the parentSite.
        title: Parent Site ID
        notes:
        - An example would be surface testing in a LTC facility. The LTC facility
          would be the parentSiteID, and the various rooms/surfaces would be the sub-sites,
          or child-sites.
        range: string
        pattern: ^.{0,30}$
      siteID:
        description: Unique identifier for the location where a sample was taken.
        title: Site ID
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      datasetID:
        description: The name of the dataset that stores information for MeasureReport,
          SampleReport and other reporting tables.
        title: Dataset ID
        notes:
        - Where possible, datasetID name should correspond the orignial data custodian
          responsible for generating environmental data. (suggestion for a default
          name convention.)
        range: datasets
        pattern: ^.{0,30}$
      polygonID:
        description: Unique identifier for the polygon.
        title: Polygon ID
        notes:
        - A polygon is a geographic are representing the capment area of an environmental
          sample.
        range: polygons
        pattern: ^.{0,10}$
      siteType:
        description: Type of site or institution where sample was taken.
        title: Site Type
        range: siteTypeSet
        required: true
        pattern: ^.{0,30}$
      sampleShed:
        description: A geographic area, physical space, or structure. A sample is
          taken from a sampleshed for a representative measurement of a substance(s).
        title: Sample shed
        notes:
        - 'Examples: Airplane, Long-term care home, Neighbourhood, University campus,
          Municipality'
        range: shedSet
        required: true
        pattern: ^.{0,30}$
      addressID:
        description: A unique identifier for an address.
        title: Address ID
        range: addresses
        pattern: ^.{0,30}$
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
        range: string
        pattern: ^.{0,100}$
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
        range: contacts
        required: true
        pattern: ^.{0,30}$
      name:
        description: Name of a domain, specimen, group, class, attribute, unit, nomeclature
          or other entity.
        title: Name
        notes:
        - Name of any entity. Use a prefix to distinguish names from different report
          tables. See fully specified name (FSN) list.  i.e. Si-name = Site name,
          Po-name = Polygon name, Or-name = Organization name, Me-name = Method-name.
        range: string
        pattern: ^.{0,30}$
      descr:
        description: A detailed description of a measure, method, or attribute.
        title: Description
        notes:
        - A description of the part that serves a clear presentation of the part to
          a wide audience including techinical and not techincal staff. A description
          should allow any person who generates environment surveillance data to know
          how to identify how to record their data elements in the ODM. partReference
          can be used to further describe a part.
        range: string
        pattern: ^.{0,200}$
      repOrg1:
        description: The primary or most responsible authority for rountine surveillance
          reports or findings, or where the site is located.
        title: Primary reporting authority ID
        notes:
        - Use the `organizations` table to describe attributes such as the name and
          address of the organziation. Use `orgType`, `orgLevel` and `orgSector` to
          describe additional attributes. For example,whether the organization is
          a government agency (`orgType`), local (`orgLevel`), or public health (`orgSector).
          If the attributes are not specified, the default is version 1.1.0 `publicHealthDepartment`
          defined as 'The public health department or region where the site is located.
          See also `healthReg` if there is a separate regional health care delivery
          authority.`
        range: string
        pattern: ^.{0,30}$
      repOrg2:
        description: The secondary, additional or alternative authority for rountine
          surveillance reports or findings, or where the site is located.
        title: Secondary reporting authority ID
        notes:
        - Use the `organizations` table to describe attributes such as the name and
          address of the organziation. Use `orgType`, `orgLevel` and `orgSector` to
          describe additional attributes. For example,whether the organization is
          a government agency (`orgType`), local (`orgLevel`), or public health (`orgSector).
          If the attributes are not specified, the default is version 1.1.0 `healthRegion`,
          The health planning authority where is site is located. defined as 'The
          public health department or region where the site is located.'
        range: string
        pattern: ^.{0,30}$
      healthRegion:
        description: A free-text variable for listing the health region for a given
          site.
        title: Health Region for a Site
        range: string
        pattern: ^.{0,30}$
      geoLat:
        description: 'Geographical location, latitude in decimal coordinates, ie.:
          (45.424721)'
        title: Latitude
        range: float
        minimum_value: -90
        maximum_value: 90
      geoLong:
        description: 'Geographical location, longitude in decimal coordinates, ie.:
          (-75.695000)'
        title: Longitude
        range: float
        minimum_value: -180
        maximum_value: 180
      geoEPSG:
        description: The unique EPSG code specifying a given geospatial area.
        title: European Petroleum Survey Group Coordinates
        range: float
        pattern: ^.{0,30}$
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
