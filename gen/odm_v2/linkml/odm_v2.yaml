  protocolSteps:
    description: The table for collecting metadata on individual steps in a protocol,
      methodological process, or assay.
    title: Protocol steps table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - stepID
    - method
    - measure
    - summ
    - sourceStep
    - stepVer
    - refLink
    - organizationID
    - contactID
    - instrumentID
    - value
    - unit
    - aggregation
    - lastEdited
    - notes
    slot_usage:
      stepID:
        description: The unique identifier for a specific protocol step.
        title: Protocol Step ID
        notes:
        - Protocol Steps are the component parts of a larger protocols, the latter
          being linked to specific measure reports.
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      method:
        description: A procedure for collecting a sample or performing a measure.
        title: Method
        range: methods
        pattern: ^.{0,10}$
      measure:
        description: A measurement or observation of any substance including a biological,
          physical or chemical substance.
        title: Measure
        notes:
        - An measurement is recorded from a specimen (i.e. a site, sample, person
          or population). Measures are organized into groups and classes (sub-groups).
        range: measurements
        pattern: ^.{0,12}$
      summ:
        description: Short description of the assay and how it is different from the
          other assay methods.
        title: Summary
        range: string
        pattern: ^.{0,255}$
      sourceStep:
        description: Specifies the protocol step which serves as a basis for a given
          protocol step.
        title: Protocol step source ID
        notes:
        - Populate with a protocol step ID (stepID).
        range: string
        pattern: ^.{0,30}$
      stepVer:
        description: Specifies the version of a given protocol step.
        title: Protocol step version
        notes:
        - Version of the method step. Semantic versioning is recommended.
        range: string
        pattern: ^.{0,50}$
      refLink:
        description: Link to the reference material for a part. May link to literature
          on a method, measure, etc.
        title: Reference link
        notes:
        - Link to standard operating procedure for a measure or part. Part reference
          is a reference to a technical document that describes the part in detail.
          The reference could be a URL, DOI, or reference to a techincal report.
        range: string
        pattern: ^.{0,255}$
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
        range: organizations
        pattern: ^.{0,100}$
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
        range: contacts
        pattern: ^.{0,30}$
      instrumentID:
        description: A unique identifier for an instrument.
        title: Instrument ID
        range: instruments
        pattern: ^.{0,10}$
      value:
        description: Value of a measure, observation or attribute.
        title: Value
        notes:
        - Only used for the dictionary entries of parts.
        range: string
        pattern: ^.{0,15}$
      unit:
        description: The units of a measurement.
        title: Unit
        notes:
        - Different units that are used to describe measurement values. Units are
          combined into UnitSetIDs. Please requests new units by creating an issue
          in the ODM repository.
        range: units
        pattern: ^.{0,30}$
      aggregation:
        description: Statistical measures used to report a measure. Each aggregation
          has a corresponding value.
        title: Aggregation
        notes:
        - The default aggregation is `single`, which corresponds to a single measurement.
        range: aggregations
        pattern: ^.{0,12}$
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
  protocolRelationships:
    description: The table that contains the organizational information and details
      (such as order) about a given protocol, recorded as a series of protocol steps
      (protocolSteps).
    title: Protocol relationships table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - protocolRelationshipsID
    - protocolIDContainer
    - protocolIDObj
    - stepIDObj
    - relationshipID
    - protocolIDSub
    - stepIDSub
    - lastEdited
    - notes
    slot_usage:
      protocolRelationshipsID:
        description: A unique, autoincremental ID generated to produce a unique identifier
          and primary key for each row of the protocolRelationships table.
        title: Synthetic ID for the protocolRelationships table
        identifier: true
        range: string
        required: true
        pattern: ^.{0,50}$
      protocolIDContainer:
        description: Unique identifier for the protocol and the steps and other protocols
          that make it up.
        title: Protocol ID container
        notes:
        - Protocol ID Container in popuated by a protocolID (partID = protocolID)
        range: string
        required: true
        pattern: ^.{0,15}$
      protocolIDObj:
        description: The object of the relationship between one protocol and another
          protocol or step, within a given protocol ID container.
        title: Protocol ID object
        notes:
        - 'Populate this field using Protocol ID (partID = protocolID). Together with
          `protocolIDSub` or `stepIDSub` and `relationshipID`, the protocol relationship
          is defined as: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        range: string
        pattern: ^.{0,30}$
      stepIDObj:
        description: The object of the relationship between one protocol step and
          another step or protocol, within a given protocol ID container.
        title: Step ID Object
        notes:
        - 'Populate this field using Protocol Step ID (partID = stepID). Together
          with `protocolIDSub` or `stepIDSub` and `relationshipID` the row of `protocolRelationships`
          should say: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        range: integer
        minimum_value: 1
      relationshipID:
        description: Attribute for specifying the relationship between a sample subject
          and object.
        title: Relationship between entities
        notes:
        - 'Together with `sampleIDSubject` and `sampleRelID`, a row of the `sampleRelationships`
          should say: [sampleIDSubject] is a [sampleID] of [sampleIDObject]'
        range:
        - sampleRelSet
        - protocolRelSet
        required: true
        pattern: ^.{0,30}$
      protocolIDSub:
        description: The subject of the relationship between one protocol and another
          protocol or step, within a given protocol ID container.
        title: Protocol ID subject
        notes:
        - 'Populate this field using Protocol ID (partID = protocolID). Together with
          `protocolIDObj` or `stepIDObj` and `relationshipID` the row of `protocolRelationships`
          should say: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        range: string
        pattern: ^.{0,30}$
      stepIDSub:
        description: The subject of the relationship between one protocol step and
          another step or protocol, within a given protocol ID container.
        title: Step ID Subject
        notes:
        - 'Populate this field using Protocol ID (partID = stepID). Together with
          `protocolIDSub` or `stepIDSub` and `relationshipID` the row of `protocolRelationships`
          should say: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        range: string
        pattern: ^.{0,30}$
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
  samples:
    description: The table that contains information about a sample. A sample is defined
      as a representative volume of wastewater (or other forms of water or liquid),
      air, or surface area taken from a site.
    title: Sample report table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - sampleID
    - protocolID
    - organizationID
    - contactID
    - siteID
    - purpose
    - saMaterial
    - datasetID
    - origin
    - repType
    - collType
    - collPer
    - collNum
    - pooled
    - collDT
    - collDTStart
    - collDTEnd
    - sentDate
    - recDate
    - reportable
    - lastEdited
    - notes
    slot_usage:
      sampleID:
        description: Unique identifier for a sample.
        title: Sample ID
        notes:
        - Suggestion:siteID-date-index.
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      protocolID:
        description: A unique identifier for a given protocol.
        title: Protocol ID
        range: protocols
        pattern: ^.{0,30}$
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
        range: string
        pattern: ^.{0,100}$
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
        range: contacts
        pattern: ^.{0,30}$
      siteID:
        description: Unique identifier for the location where a sample was taken.
        title: Site ID
        range: sites
        required: true
        pattern: ^.{0,30}$
      purpose:
        description: The reason the measure or sample was taken.
        title: Purpose
        notes:
        - 'See allowed categories: report, quality control, validation study, test'
        range: purposeSet
        pattern: ^.{0,30}$
      saMaterial:
        description: Type of sample.
        title: Sample material
        range: sampleMatSet
        required: true
        pattern: ^.{0,30}$
      datasetID:
        description: The name of the dataset that stores information for MeasureReport,
          SampleReport and other reporting tables.
        title: Dataset ID
        notes:
        - Where possible, datasetID name should correspond the orignial data custodian
          responsible for generating environmental data. (suggestion for a default
          name convention.)
        range: datasets
        pattern: ^.{0,30}$
      origin:
        description: An attribute of a sample specifying the origin.
        title: Sample origin
        range: originSet
        pattern: ^.{0,30}$
      repType:
        description: Attirbute of a sample, specifying whether the sample is unique,
