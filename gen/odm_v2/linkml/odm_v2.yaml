    - qualityReportsRequired
    - qualityReportsOrder
    - sampleRelationships
    - sampleRelationshipsRequired
    - sampleRelationshipsOrder
    - protocols
    - protocolsRequired
    - protocolsOrder
    - countries
    - countriesRequired
    - countriesOrder
    - zones
    - zonesRequired
    - zonesOrder
    - wideNames
    - wideNamesRequired
    - wideNamesOrder
    - refLink
    - dataTypes
    - minValue
    - maxValue
    - minLength
    - maxLength
    slot_usage:
      partID:
        description: The unique identify of any entity within the dictionary.
        title: Part identifier
        notes:
        - Every entity in the ODM has a partID. The partID must be unique with no
          duplcates. partIDs are short. partIDs that are constructed by different
          part attributes can be up 28 characters (check max), but each part attibute
          should be 1 to 5 characters. partIDs are machine readible, but a knowledgable
          user can understand what they represent. partID are used, for example, as
          a header in an Excel input table. Numbers are allowed but there no other
          special characters other than `_`. `_` is a reserved character that is used
          to generate a partID using a compoent or table attributes. A partID for
          a subComponent is automatically generated using attributes of a component.
          For example, the partID for the compoent `SARS-CoV-2` is `covid`. `Covid`
          can have many subComponents including different groups (Covid-19-al, Covid-19-va,
          ovid-pr (allele, variant or protein) or units and aggregatrions (i.e. covid-al-N1-mean-cpl
          representing ovid allele N1, mean observation of viral copies per litre
          of effluent). A similar approach to naming subComponent is use for naming
          parts in a reprotTable.
        identifier: true
        range: string
        required: true
        pattern: ^.{0,28}$
      label:
        description: A human readable label of a part.
        title: Label
        notes:
        - Typically, a part label has no acrynomns (every word is spelled out). Equivalent
          to a LOINC common name.
        range: string
        required: true
        pattern: ^.{0,30}$
      partType:
        description: Part types describe the purpose or use of the part.
        title: Part types
        notes:
        - 'Enivornment data has three main part types: measure (i.e. covN1 viral measures,
          wasteawater flow rate, temperature), method (e.g. how the measure was taken),
          and attribute (such as a site name). See description of each of the part
          types within categorySetID = partTypeCatSets.'
        range: partType
        required: true
        pattern: ^.{0,15}$
      shortName:
        description: Shortened names for tables and other important parts for use
          in wide names.
        title: Short names
        range: string
        pattern: ^.{0,30}$
      partDesc:
        description: The description of the part.
        title: Part description
        notes:
        - Provides description of the part, used for tranlsation.
        range: string
        required: true
        pattern: ^.{0,30}$
      partInstr:
        description: Additional notes and instructions on how a part is used and/or
          defined.
        title: Part instruction
        range: string
        pattern: ^.{0,200}$
      domain:
        description: Domain is the highest level of describing of a measure.
        title: Domain
        notes:
        - The domain ID that corresponds to a given part. Mostly applicable for measures,
          methods, units, and aggregations.
        range: domains
        required: true
        pattern: ^.{0,30}$
      compartmentSet:
        description: An idenfication of a set of compartments that can be applied
          for a measure or method.
        title: Compartment Set Header
        range: string
        required: true
        pattern: ^.{0,30}$
      specimenSet:
        description: An idenfication of a set of specimens that can be applied for
          a measure or method.
        title: Specimen Set Header
        range: string
        required: true
        pattern: ^.{0,30}$
      group:
        description: Unique identifier for a group of measures. Mostly applicable
          for measures, methods, units, and aggregations.
        title: Group
        notes:
        - A collection of related measures. For example, SARS-CoV-2 is a group. Within
          the SARS-CoV-2 group, there are measure classes tht include RNA alleles
          (N1, N2, E, etc.), mutations, (E484K0), an entire sequence, viral proteins,
          etc. Currently groups are used for measures only.
        range: groups
        required: true
        pattern: ^.{0,30}$
      class:
        description: A unique identifier for a class, which is akin to a sub-group;
          it's a way of grouping parts within a given group. A group can have one
          or more classes to describe different parts of the class.
        title: Class
        notes:
        - Currently, class is only used for biologics. For example, SARS-CoV-2 is
          a group of measures with the following classes of allele, variant, mutation,
          sequence, and protein.
        range: classes
        required: true
        pattern: ^.{0,30}$
      nomenclature:
        description: A classification system to report the measure class. Only applicable
          to variants, mutations, and diseases.
        title: Nomenclature
        notes:
        - Currently only used for class = variant, mutation, or disease. Valid options
          are currently restricted to 'NextClade', 'Pangolin', 'WHO', or 'ICD'.
        range: nomenclatures
        pattern: ^.{0,30}$
      ontologyRef:
        description: Ontology reference for a part.
        title: Ontology reference
        notes:
        - This field contains a link to an existing ontology reference for the part.
          ODM content spans several existing ontologies. ODM does not strive to generate
          a new ontology, rather ODM seeks to harmonize and extend dictionaries for
          application in environmental and public health surveillance.
        range: string
        pattern: ^.{0,200}$
      latExp:
        description: LaTeX expression used to generate formulas, symbols, etc.  Mainly
          relevant for units.
        title: LaTeX expression
        range: string
        pattern: ^.{0,20}$
      mmaSet:
        description: The set for a measure, method, or attribute. Only applicable
          for categorical fields, and the categories that populate them.
        title: Measure, Method, or Attribute Set Header
        range: mmaSets
        pattern: ^.{0,12}$
      unitSet:
        description: An idenfication of a set of units that can be used for a measure
          or method.
        title: Unit set
        range: string
        pattern: ^.{0,30}$
      aggragationScale:
        description: A scale used for an aggregation. Only applicable for measures
          and units.
        title: Aggregation scale
        range: aggregationScales
        pattern: ^.{0,12}$
      aggregationSet:
        description: The aggregation set for a unit.
        title: Aggregation set
        range: aggregationSets
        required: true
        pattern: ^.{0,12}$
      qualityIndSet:
        description: The quality set that corresponds to a given part. Only applicable
          for samples and measures.
        title: Quality Indicator Set Header
        range: string
        pattern: ^.{0,30}$
      missingnessSet:
        description: Missingness sets for measures, methods or attributes.
        title: Missingness Set
        notes:
        - Inputted data into an ODM field may have missing data. The missingness set
          lists valid missing categories for the measure, method, or attribute.
        range: missingnessSets
        pattern: ^.{0,15}$
      status:
        description: Whether the part is still active and can be used in the most
          current ODM version. Values are 'active' or 'inactive'.
        title: Status
        notes:
        - The status of the part or list. 'active' means the part is used in the dictionary
          version. 'inactive' means the part has been retired and not longer used
          in the version.
        range: statusSet
        required: true
        pattern: ^.{0,30}$
      firstReleased:
        description: The version in which a part was first released
        title: First released version
        range: string
        required: true
        pattern: ^.{0,30}$
      lastUpdated:
        description: The version in which the part was last updated.
        title: Last updated version
        notes:
        - Any change to the part of list will result in a change in the lastUpdated
          field to the dictionary version where the update occurred.
        range: string
        required: true
        pattern: ^.{0,30}$
      changes:
        description: A column for recording the changes from a previous version.
        title: Changes column
        notes:
        - Use this column as a short-hand change log for dictionary development.
        range: string
        pattern: ^.{0,30}$
      protocolSteps:
        description: The table for collecting metadata on individual steps in a protocol,
          methodological process, or assay.
        title: Protocol steps table
        range: string
        pattern: ^.{0,30}$
      protocolRelationshipsRequired:
        description: Specifies the columns required in the Protocol Organization table.
        title: Protocol Relationship table required headers
        range: string
        pattern: ^.{0,30}$
      protocolStepsRequired:
        description: Specifies the columns required in a Protocol Steps table.
        title: Protocol steps table required headers
        range: string
        pattern: ^.{0,30}$
      protocolStepsOrder:
        description: Specifies the order of the columns in a Protocol Steps table.
        title: Protocol steps table column order
        range: integer
        minimum_value: 1
      protocolRelationships:
        description: The table that contains the organizational information and details
          (such as order) about a given protocol, recorded as a series of protocol
          steps (protocolSteps).
        title: Protocol relationships table
        notes:
        - Protocols are a group of related protocol steps. For example a protocol
          step can describe a sample concentration, extraction, inhibition or a measurement.
          Protocols can include both methodID (a proceedure) and measureIDs (a measure).
          An example of a method is centrifugation; where the centriguation rotation
          speed is described as a measure.
        range: string
        pattern: ^.{0,30}$
      protocolRelationshipsOrder:
        description: Specifies the order of the columns in the Protocol Organization
          table.
        title: Protocol relationships table column order
        range: integer
        minimum_value: 1
      measures:
        description: The table that contains information and details about a given
          measure
        title: Measure report table
        notes:
        - adapt from verson 1 documentation
        range: string
        pattern: ^.{0,30}$
      measuresRequired:
        description: Specifies the columns required in a Measures table.
        title: Measures table required headers
        range: string
        pattern: ^.{0,30}$
      measuresOrder:
        description: Specifies the order of the columns in a Measures table.
        title: Measures table column order
        range: integer
        minimum_value: 1
      measureSets:
        description: The table that identifies sets of measures.
        title: Measure set report table
        notes:
        - Examples of measure sets include a set of replicates, dilutions (used to
          generate a Ct curve) or varients that are identified in a single sample.
        range: string
        pattern: ^.{0,30}$
      measureSetsOrder:
        description: Specifies the order of the columns in a Measure Sets table.
        title: Measure sets table column order
        range: integer
        minimum_value: 1
      measureSetsRequired:
        description: Specifies the columns required in a Measure Sets table.
        title: Measure Set table required headers
        range: string
        pattern: ^.{0,30}$
      datasets:
        description: A report table for capturing details about data's parental data
          set and data custodians. Supplying attribution for data collectors.
        title: Dataset table
        range: string
        pattern: ^.{0,30}$
      datasetsRequired:
        description: Specifies the columns required in a Datasets table.
        title: Dataset table required headers
        range: string
        pattern: ^.{0,30}$
      datasetsOrder:
        description: Specifies the order of the columns in a Datasets table.
        title: Datasets table column order
        range: integer
        minimum_value: 1
      sites:
        description: The table that contains information about a site; the location
          where an environmental sample was taken.
        title: Sites table
        notes:
        - The site of an eviromental sample. Information in the site table does not
          regularly change. Consider using the MeasureReport table if the infomation
          changes often.
        range: string
        pattern: ^.{0,30}$
      sitesRequired:
        description: Specifies the columns required in a Sites table.
        title: Sites table required headers
        range: string
        pattern: ^.{0,30}$
      sitesOrder:
        description: Specifies the order of the columns in a Sites table.
        title: Sites table column order
        range: integer
        minimum_value: 1
      samples:
        description: The table that contains information about a sample. A sample
          is defined as a representative volume of wastewater (or other forms of water
          or liquid), air, or surface area taken from a site.
        title: Sample report table
        notes:
        - Samples can be combined, split, stored and reused. The `Sample relationships`
          (sampleRelationships) is used to describe the relationships between samples.
        range: string
        pattern: ^.{0,30}$
      samplesRequired:
        description: Specifies the columns required in a Samples table.
        title: Sample table required headers
        range: string
        pattern: ^.{0,30}$
      samplesOrder:
        description: Specifies the order of the columns in a Samples table.
        title: Samples table column order
        range: integer
        minimum_value: 1
      addresses:
        description: The table that contains information about addresses. Addresses
          can recorded for sites, organizations or contacts (indivduals).
        title: Address table
        notes:
        - The Sites, Organizations, and Contacts tables include a link to the addresses
          table through Address ID.
        range: string
        pattern: ^.{0,30}$
      addressesRequired:
        description: Specifies the columns required in a Addresses table.
        title: Address table required headers
        range: string
        pattern: ^.{0,30}$
      addressesOrder:
        description: Specifies the order of the columns in the Addresses table.
        title: Addresses table column order
        range: integer
        minimum_value: 1
      contacts:
        description: The table that contains information about a contact; a person
          who is the contact of a site or laboratory.
        title: Contact table
        notes:
        - adapt from verson 1 documentation
        range: string
        pattern: ^.{0,30}$
      contactsRequired:
        description: Specifies the columns required in a Contacts table.
        title: Contact table required headers
        range: string
        pattern: ^.{0,30}$
      contactsOrder:
        description: Specifies the order of the columns in a Contacts table.
        title: Contacts table column order
        range: integer
        minimum_value: 1
      organizations:
        description: The table that contains information about a laboratory.
        title: Organization table
        notes:
        - adapt from verson 1 documentation
        range: string
        pattern: ^.{0,30}$
      organizationsRequired:
        description: Specifies the columns required in a Organizations table.
        title: Organziation table required headers
        range: string
        pattern: ^.{0,30}$
      organizationsOrder:
        description: Specifies the order of the columns in a Organizations table.
        title: Organizations table column order
        range: integer
        minimum_value: 1
      instruments:
        description: The table that contains information about instruments.
        title: Instrument table
        notes:
        - adapt from verson 1 documentation
        range: string
        pattern: ^.{0,30}$
      instrumentsRequired:
        description: Specifies the columns required in the Instruments table.
        title: Instrutment table required headers
        range: string
        pattern: ^.{0,30}$
      instrumentsOrder:
        description: Specifies the order of the columns in the Instruments table.
        title: Instruments table column order
        range: integer
        minimum_value: 1
      polygons:
        description: The table that contains information about the geometry of a geographic
          area.
        title: Polygon table
        range: string
        pattern: ^.{0,30}$
      polygonsRequired:
        description: Specifies the columns required in a Polygons table.
        title: Polygon table required headers
        range: string
        pattern: ^.{0,30}$
      polygonsOrder:
        description: Specifies the order of the columns in a Polygons table.
        title: Polygons table column order
        range: integer
        minimum_value: 1
      languages:
        description: Look up table for all languages, used to give structure to the
          translation table.
        title: Language Look-up table
        range: string
        pattern: ^.{0,30}$
      languagesRequired:
        description: Required headers in the Languages  table.
        title: Language table required headers
        range: string
        pattern: ^.{0,30}$
      languagesOrder:
        description: Specifies the order of the columns in the Languages table.
        title: Language table column order
        range: integer
        minimum_value: 1
      translations:
        description: Look up table for translations of the description, label, and
          instruction for all parts.
        title: Translation look-up table
        notes:
        - The default language if a translation is not specified is English.
        range: string
        pattern: ^.{0,30}$
      parts:
        description: Look up table containing all parts in of the data model.
        title: Parts Look-up table
        notes:
        - Contains all parts, including self-referential parts.
        range: string
        pattern: ^.{0,30}$
      translationsRequired:
        description: Required headers in the Translations table.
        title: Translation table required headers
        range: string
        pattern: ^.{0,30}$
      partsOrder:
        description: Order of headers in the Parts table.
        title: Parts table column order
        range: string
        pattern: ^.{0,30}$
      translationsOrder:
        description: Specifies the order of the columns in the Translation table.
        title: Translation table column order
        range: integer
        minimum_value: 1
      partsRequired:
        description: Required headers in the Parts table.
        title: Parts table required headers
        range: string
        pattern: ^.{0,30}$
      sets:
        description: Look up table for all sets, managing how categorical inputs for
          various methods and attributes are grouped together.
        title: Sets look-up table
        notes:
        - This table manages many-to-many relationships and category recycling within
          the ODM.
        range: string
        pattern: ^.{0,30}$
      setsOrder:
        description: Specifies the order of the columns in the Sets table.
        title: Sets table column order
        range: integer
        minimum_value: 1
      setsRequired:
        description: Required headers in the Sets table.
        title: Sets table required headers
        range: string
        pattern: ^.{0,30}$
      qualityReports:
        description: The table for recording the various quality metrics and indicators
          for samples and measures.
        title: Quality reports table
        range: string
        pattern: ^.{0,30}$
      qualityReportsRequired:
        description: Specifies the columns required in the Quality Reports table.
        title: Quality report table required headers
        range: string
        pattern: ^.{0,30}$
      qualityReportsOrder:
        description: Specifies the order of the columns in the Quality Reports table.
        title: Quality rerpots table column order
        range: integer
        minimum_value: 1
      sampleRelationships:
        description: Table for recording the relationships between samples.
        title: Sample relationships table
        notes:
        - Samples can be pooled or split. The sample relationships table holds information
          on parent-child relationships between samples, and allow for tracking sample
          lineage for single and pooled samples.
        range: string
        pattern: ^.{0,30}$
      sampleRelationshipsRequired:
        description: Specifies the columns required in a Sample Relationships table.
        title: Sample relationships table required headers
        range: string
        pattern: ^.{0,30}$
      sampleRelationshipsOrder:
        description: Specifies the order of the columns in a Sample Relationships
          table.
        title: Sample relationships table column order
        range: integer
        minimum_value: 1
      protocols:
        description: The table for protocols.
        title: Protocols table
        range: string
        pattern: ^.{0,30}$
      protocolsRequired:
        description: Specifies the columns required in the Protocols table.
        title: Protocols table required headers
        range: string
        pattern: ^.{0,30}$
      protocolsOrder:
        description: Specifies the order of the columns in the Protocols table.
        title: Protocols table column order
        range: integer
        minimum_value: 1
      countries:
        description: Look up table for the possible country inputs.
        title: Countries look-up tables
        range: string
        pattern: ^.{0,30}$
      countriesRequired:
        description: Required headers in the countries table.
        title: Counries table required headers
        range: string
        pattern: ^.{0,30}$
      countriesOrder:
        description: Specifies the order of the columns in the countries table.
        title: Countries table column order
