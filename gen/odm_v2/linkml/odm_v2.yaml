  protocols:
    description: The table for protocols.
    title: Protocols table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - sourceProtocol
    - protocolID
    - datasetID
    - name
    - summ
    - refLink
    - organizationID
    - contactID
    - protocolVersion
    - lastEdited
    - notes
    slot_usage:
      sourceProtocol:
        description: A protocol that served as a basis for another protocol. This
          may be due to version changes, or a referencing a protocol that was later
          adapted.
        title: Source Protocol ID
        notes:
        - Populate with protocolID.
        range: string
        pattern: ^.{0,30}$
      protocolID:
        description: A unique identifier for a given protocol.
        title: Protocol ID
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      datasetID:
        description: The name of the dataset that stores information for MeasureReport,
          SampleReport and other reporting tables.
        title: Dataset ID
        notes:
        - Where possible, datasetID name should correspond the orignial data custodian
          responsible for generating environmental data. (suggestion for a default
          name convention.)
        range: datasets
        pattern: ^.{0,30}$
      name:
        description: Name of a domain, specimen, group, class, attribute, unit, nomeclature
          or other entity.
        title: Name
        notes:
        - Name of any entity. Use a prefix to distinguish names from different report
          tables. See fully specified name (FSN) list.  i.e. Si-name = Site name,
          Po-name = Polygon name, Or-name = Organization name, Me-name = Method-name.
        range: string
        pattern: ^.{0,30}$
      summ:
        description: Short description of the assay and how it is different from the
          other assay methods.
        title: Summary
        range: string
        pattern: ^.{0,255}$
      refLink:
        description: Link to the reference material for a part. May link to literature
          on a method, measure, etc.
        title: Reference link
        notes:
        - Link to standard operating procedure for a measure or part. Part reference
          is a reference to a technical document that describes the part in detail.
          The reference could be a URL, DOI, or reference to a techincal report.
        range: string
        pattern: ^.{0,255}$
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
        range: organizations
        pattern: ^.{0,100}$
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
        range: contacts
        pattern: ^.{0,30}$
      protocolVersion:
        description: Specifies the version of a method set.
        title: Protocol version
        notes:
        - Version of the method set. Semantic versioning is recommended.
        range: integer
        minimum_value: 1
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
  sets:
    description: Look up table for all sets, managing how categorical inputs for various
      methods and attributes are grouped together.
    title: Sets look-up table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - setCompID
    - setID
    - setType
    - partID
    - label
    - enumeration
    - status
    - firstReleased
    - lastUpdated
    - changes
    - notes
    slot_usage:
      setCompID:
        description: A composite ID generated by concatennating the 'setID' and 'partID'
          of a given row in the sets table. This allows for a unique primary key and
          robust relational database structure.
        title: Composite Set ID
        identifier: true
        range: string
        required: true
        pattern: ^.{0,60}$
      setID:
        description: The unique identifier of a value set.
        title: Set ID
        notes:
        - A set is a group of units, attributes, categories, specimens, or compartments
          that can be used for a measure, method or attribute.
        identifier: true
        range: string
        required: true
        pattern: ^.{0,28}$
      setType:
        description: The type of set. i.e. quality set, aggregation set, unit set
        title: Set type
        required: true
        pattern: ^.{0,30}$
      partID:
        description: The unique identify of any entity within the dictionary.
        title: Part identifier
        notes:
        - Every entity in the ODM has a partID. The partID must be unique with no
          duplcates. partIDs are short. partIDs that are constructed by different
          part attributes can be up 28 characters (check max), but each part attibute
          should be 1 to 5 characters. partIDs are machine readible, but a knowledgable
          user can understand what they represent. partID are used, for example, as
          a header in an Excel input table. Numbers are allowed but there no other
          special characters other than `_`. `_` is a reserved character that is used
          to generate a partID using a compoent or table attributes. A partID for
          a subComponent is automatically generated using attributes of a component.
          For example, the partID for the compoent `SARS-CoV-2` is `covid`. `Covid`
          can have many subComponents including different groups (Covid-19-al, Covid-19-va,
          ovid-pr (allele, variant or protein) or units and aggregatrions (i.e. covid-al-N1-mean-cpl
          representing ovid allele N1, mean observation of viral copies per litre
          of effluent). A similar approach to naming subComponent is use for naming
          parts in a reprotTable.
        range: parts
        required: true
        pattern: ^.{0,28}$
      label:
        description: A human readable label of a part.
        title: Label
        notes:
        - Typically, a part label has no acrynomns (every word is spelled out). Equivalent
          to a LOINC common name.
        range: string
        required: true
        pattern: ^.{0,30}$
      enumeration:
        description: The numeric value that corresponds to a given value in a set,
          defined in the sets table.
        title: Enumeration for set values
        range: integer
        required: true
        minimum_value: 0
        maximum_value: 100
      status:
        description: Whether the part is still active and can be used in the most
          current ODM version. Values are 'active' or 'inactive'.
        title: Status
        notes:
        - The status of the part or list. 'active' means the part is used in the dictionary
          version. 'inactive' means the part has been retired and not longer used
          in the version.
        range: statusSet
        required: true
        pattern: ^.{0,30}$
      firstReleased:
        description: The version in which a part was first released
        title: First released version
        range: string
        required: true
        pattern: ^.{0,30}$
      lastUpdated:
        description: The version in which the part was last updated.
        title: Last updated version
        notes:
        - Any change to the part of list will result in a change in the lastUpdated
          field to the dictionary version where the update occurred.
        range: string
        required: true
        pattern: ^.{0,30}$
      changes:
        description: A column for recording the changes from a previous version.
        title: Changes column
        notes:
        - Use this column as a short-hand change log for dictionary development.
        range: string
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
