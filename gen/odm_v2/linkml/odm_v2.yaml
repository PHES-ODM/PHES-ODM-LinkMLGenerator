          is affiliated.
        title: Organization ID
        range: organizations
        pattern: ^.{0,100}$
      descr:
        description: A detailed description of a measure, method, or attribute.
        title: Description
        notes:
        - A description of the part that serves a clear presentation of the part to
          a wide audience including techinical and not techincal staff. A description
          should allow any person who generates environment surveillance data to know
          how to identify how to record their data elements in the ODM. partReference
          can be used to further describe a part.
        range: string
        pattern: ^.{0,200}$
      refLink:
        description: Link to the reference material for a part. May link to literature
          on a method, measure, etc.
        title: Reference link
        notes:
        - Link to standard operating procedure for a measure or part. Part reference
          is a reference to a technical document that describes the part in detail.
          The reference could be a URL, DOI, or reference to a techincal report.
        range: string
