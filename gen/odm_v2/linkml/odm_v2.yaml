  instruments:
    description: The table that contains information about instruments.
    title: Instrument table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - instrumentID
    - datasetID
    - name
    - model
    - manufacturer
    - contactID
    - organizationID
    - descr
    - refLink
    - insType
    - insTypeOth
    - index
    - lastEdited
    - notes
    slot_usage:
      instrumentID:
        description: A unique identifier for an instrument.
        title: Instrument ID
        identifier: true
        range: string
        required: true
        pattern: ^.{0,10}$
      datasetID:
        description: The name of the dataset that stores information for MeasureReport,
          SampleReport and other reporting tables.
        title: Dataset ID
        notes:
        - Where possible, datasetID name should correspond the orignial data custodian
          responsible for generating environmental data. (suggestion for a default
          name convention.)
        range: datasets
        required: true
        pattern: ^.{0,30}$
      name:
        description: Name of a domain, specimen, group, class, attribute, unit, nomeclature
          or other entity.
