name: Generate the ODM schema
description: >-
  Downloads the published dictionary tables at one commit and runs the
  generator over them, failing if the generator logged an error. Used by every
  workflow that needs a freshly generated schema, so that they all generate it
  the same way.

# .github/actions/odm-config has to have run first: ODM_VERSION,
# DICTIONARY_REPO, DICTIONARY_DIR and DICTIONARY_REF_DEFAULT all come from the
# environment it sets up.

inputs:
  dictionary-ref:
    description: 'Branch, tag, or SHA of DICTIONARY_REPO to read the tables from. Defaults to DICTIONARY_REF_DEFAULT.'
    required: false
    default: ''
  dictionary-dir:
    description: 'Directory of DICTIONARY_REPO to read the tables from. Defaults to DICTIONARY_DIR. Override to generate an archival version whose tables have been moved to their own folder (e.g. "archived V2.3 (PATCH)").'
    required: false
    default: ''
  odm-version:
    description: 'Major ODM version to generate (passed to the generator as --version, and used to name the committed schema schemas/odm_v<version>.yaml). Defaults to ODM_VERSION. Override when dictionary-dir points at a different major version than the default (e.g. 2 for a v2.x archival release, since ODM_VERSION defaults to 3).'
    required: false
    default: ''
  output-dir:
    description: 'Where the generator writes its three stages. Defaults to gen/odm_v<ODM_VERSION>.'
    required: false
    default: ''
  download-dir:
    description: 'Where the downloaded tables are staged. Must not be the output directory, which the generator clears before reading them.'
    required: false
    default: gen/dictionary-download
  log-file:
    description: 'Where the generator log is written. It is read back to decide whether the run produced a usable schema.'
    required: false
    default: gen/generate.log
  python-version:
    description: 'The Python the generator runs on.'
    required: false
    default: '3.10'
  github-token:
    description: 'Token used to resolve the dictionary ref to a commit SHA. Only needs public read.'
    required: false
    default: ${{ github.token }}

outputs:
  ref:
    description: 'The dictionary ref that was read.'
    value: ${{ steps.resolve.outputs.ref }}
  sha:
    description: 'The commit of DICTIONARY_REPO the tables were read from.'
    value: ${{ steps.resolve.outputs.sha }}
  odm-version:
    description: 'The major ODM version that was generated.'
    value: ${{ steps.resolve.outputs.odm-version }}
  dictionary-dir-used:
    description: 'The directory of DICTIONARY_REPO the tables were read from.'
    value: ${{ steps.resolve.outputs.dictionary-dir-used }}
  parts-file:
    description: 'The versioned parts CSV filename found in dictionary-dir-used.'
    value: ${{ steps.files.outputs.parts-file }}
  sets-file:
    description: 'The versioned sets CSV filename found in dictionary-dir-used.'
    value: ${{ steps.files.outputs.sets-file }}
  output-dir:
    description: 'The directory the three stages were written to.'
    value: ${{ steps.resolve.outputs.output-dir }}
  schema-file:
    description: 'The generated LinkML schema.'
    value: ${{ steps.resolve.outputs.schema-file }}
  dictionary-dir:
    description: 'The stage 1 directory, holding parts.csv and sets.csv as every consumer of the tables wants them named.'
    value: ${{ steps.resolve.outputs.dictionary-dir }}
  log-file:
    description: 'The generator log.'
    value: ${{ steps.resolve.outputs.log-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install the generator
      shell: bash
      run: pip install -r requirements.txt && pip install -e . --no-deps

    - name: Resolve the dictionary ref and the output paths
      id: resolve
      # The ref a run reads can arrive from a workflow input or a dispatch
      # payload and may be absent altogether, so it is settled once here and
      # every later step reads the answer rather than working it out again.
      #
      # The resolved SHA is what the tables are actually downloaded from, so
      # that the two of them cannot come from different commits if the branch
      # moves mid-run, and so that anything committed from this run can be
      # traced back to the exact tables it came from.
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_REF: ${{ inputs.dictionary-ref }}
        INPUT_DIR: ${{ inputs.dictionary-dir }}
        INPUT_VERSION: ${{ inputs.odm-version }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_LOG_FILE: ${{ inputs.log-file }}
      run: |
        set -euo pipefail

        # A missing setting means .github/actions/odm-config has not run, which
        # is worth saying plainly: the alternative is a download from an
        # unhelpful URL made of empty strings.
        for name in ODM_VERSION DICTIONARY_REPO DICTIONARY_DIR \
                    DICTIONARY_REF_DEFAULT; do
          if [ -z "${!name:-}" ]; then
            echo "::error::${name} is not set. Run .github/actions/odm-config before this action."
            exit 1
          fi
        done

        ref="${INPUT_REF:-}"
        [ -n "${ref}" ] || ref="${DICTIONARY_REF_DEFAULT}"

        # The ref reaches a URL, and on a dispatch it comes from outside this
        # repository, so it is held to what a branch, tag, or SHA can look like
        # rather than trusted.
        case "${ref}" in
          *[!A-Za-z0-9._/-]* | *..* | /* | */ | -*)
            echo "::error::Refusing the dictionary ref '${ref}': expected a plain branch, tag, or SHA."
            exit 1
            ;;
        esac

        dictionary_dir="${INPUT_DIR:-}"
        [ -n "${dictionary_dir}" ] || dictionary_dir="${DICTIONARY_DIR}"

        odm_version="${INPUT_VERSION:-}"
        [ -n "${odm_version}" ] || odm_version="${ODM_VERSION}"

        output_dir="${INPUT_OUTPUT_DIR:-}"
        [ -n "${output_dir}" ] || output_dir="gen/odm_v${odm_version}"

        sha=$(gh api "repos/${DICTIONARY_REPO}/commits/${ref}" --jq '.sha')

        {
          echo "ref=${ref}"
          echo "sha=${sha}"
          echo "odm-version=${odm_version}"
          echo "dictionary-dir-used=${dictionary_dir}"
          echo "output-dir=${output_dir}"
          echo "schema-file=${output_dir}/linkml/odm_v${odm_version}.yaml"
          echo "dictionary-dir=${output_dir}/dictionary"
          echo "log-file=${INPUT_LOG_FILE}"
        } >> "$GITHUB_OUTPUT"
        echo "Reading ${DICTIONARY_REPO}@${ref} (${sha}), ${dictionary_dir}/, ODM v${odm_version} into ${output_dir}"

    - name: Find the versioned dictionary table filenames
      # PHES-ODM renames these files on every release
      # (ODM_parts_v3.0.0.csv -> _v3.0.1.csv, etc.) and moves a superseded
      # version's tables out of dictionary-dir entirely once retired, so
      # exactly one ODM_parts_v*.csv/ODM_sets_v*.csv is expected here at any
      # commit. Resolving them at generation time, rather than reading a
      # filename fixed in .github/odm-config.env, is what keeps this working
      # without a manual update every release -- a fixed filename is exactly
      # how this action's config went stale before (see that file's history).
      #
      # This deliberately does not fall back to the unversioned
      # ODM_parts.csv/ODM_sets.csv PHES-ODM also publishes: those carry a
      # leading `Version,X.Y.Z,...` metadata row the generator's plain CSV
      # read can't handle, and have been found out of sync with the versioned
      # file's actual columns for at least one archival release -- the
      # versioned file is the one PHES-ODM treats as the frozen source of
      # truth.
      id: files
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DICTIONARY_SHA: ${{ steps.resolve.outputs.sha }}
        DICTIONARY_DIR_USED: ${{ steps.resolve.outputs.dictionary-dir-used }}
      run: |
        set -euo pipefail
        # --method GET is required, not optional: gh api silently switches
        # to POST whenever any -f/-F field is given unless told otherwise,
        # and a POST to a read-only contents listing reports as a plain 404
        # -- indistinguishable from "repository not found" or "ref not
        # found" in the run log, which is what actually happened here
        # before this fix (confirmed empirically: the identical request,
        # unauthenticated, succeeds over plain REST -- this was never a
        # permissions or missing-commit problem).
        listing=$(gh api --method GET "repos/${DICTIONARY_REPO}/contents/${DICTIONARY_DIR_USED}" -f ref="${DICTIONARY_SHA}" --jq '.[].name')

        find_one() {
          local pattern="$1" label="$2" matches
          matches=$(grep -E "${pattern}" <<< "${listing}" || true)
          if [ "$(grep -c . <<< "${matches}")" -ne 1 ]; then
            echo "::error::Expected exactly one ${label} file in '${DICTIONARY_DIR_USED}' at ${DICTIONARY_SHA}, found: $(echo "${matches}" | tr '\n' ' ')"
            exit 1
          fi
          echo "${matches}"
        }

        parts_file=$(find_one '^ODM_parts_v[0-9.]+\.csv$' 'ODM_parts_v*.csv')
        sets_file=$(find_one '^ODM_sets_v[0-9.]+\.csv$' 'ODM_sets_v*.csv')

        {
          echo "parts-file=${parts_file}"
          echo "sets-file=${sets_file}"
        } >> "$GITHUB_OUTPUT"
        echo "Found ${parts_file} and ${sets_file}"

    - name: Download the dictionary tables
      # Pinned to the resolved SHA rather than the branch. The tables go under
      # gen/, which is git-ignored, so a run adds nothing to the working tree
      # but what it was asked to generate.
      shell: bash
      env:
        DICTIONARY_SHA: ${{ steps.resolve.outputs.sha }}
        DICTIONARY_DIR_USED: ${{ steps.resolve.outputs.dictionary-dir-used }}
        PARTS_FILE: ${{ steps.files.outputs.parts-file }}
        SETS_FILE: ${{ steps.files.outputs.sets-file }}
        DOWNLOAD_DIR: ${{ inputs.download-dir }}
      run: |
        set -euo pipefail
        # Percent-encode each path segment separately (never the assembled
        # path -- that would also escape the "/" separators between
        # segments). Plain concatenation works for dictionary-tables, the
        # live default, but an archival dictionary-dir can be a real,
        # human-titled folder name like "archived V2.3 (PATCH)" -- its
        # spaces and parentheses make an invalid URL curl refuses outright
        # ("URL rejected: Malformed input to a URL function"), confirmed
        # reproducing this exact error locally against that exact path.
        urlencode() { jq -rn --arg v "$1" '$v|@uri'; }
        dir_enc=$(urlencode "${DICTIONARY_DIR_USED}")
        parts_enc=$(urlencode "${PARTS_FILE}")
        sets_enc=$(urlencode "${SETS_FILE}")
        base="https://raw.githubusercontent.com/${DICTIONARY_REPO}/${DICTIONARY_SHA}/${dir_enc}"
        mkdir -p "${DOWNLOAD_DIR}"
        curl -sSfL -o "${DOWNLOAD_DIR}/${PARTS_FILE}" "${base}/${parts_enc}"
        curl -sSfL -o "${DOWNLOAD_DIR}/${SETS_FILE}" "${base}/${sets_enc}"
        wc -l "${DOWNLOAD_DIR}"/*.csv

    - name: Generate the schema
      # --output-dir must not be the directory the CSVs were downloaded to: the
      # generator clears it before reading them. Errors in the source
      # dictionary are logged and skipped rather than raised, so the exit status
      # alone does not tell us whether the run produced a usable schema — hence
      # the log, which the next step checks. The generator logs to stdout, so
      # the redirect is only for anything underneath it that writes to stderr.
      shell: bash
      env:
        DOWNLOAD_DIR: ${{ inputs.download-dir }}
        PARTS_FILE: ${{ steps.files.outputs.parts-file }}
        SETS_FILE: ${{ steps.files.outputs.sets-file }}
        ODM_VERSION_RESOLVED: ${{ steps.resolve.outputs.odm-version }}
        OUTPUT_DIR: ${{ steps.resolve.outputs.output-dir }}
        LOG_FILE: ${{ steps.resolve.outputs.log-file }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "${LOG_FILE}")"
        odm-linkmlgen-odm \
          --version "${ODM_VERSION_RESOLVED}" \
          --parts-file "${DOWNLOAD_DIR}/${PARTS_FILE}" \
          --sets-file "${DOWNLOAD_DIR}/${SETS_FILE}" \
          --output-dir "${OUTPUT_DIR}" \
          2>&1 | tee "${LOG_FILE}"

    - name: Check the log for errors
      # A run that exits 0 can still have produced a degraded schema: the
      # generator logs a defect in the source dictionary and carries on rather
      # than raising, so one bad part does not cost the whole run. An ERROR
      # therefore fails the job, and the caller never gets as far as publishing
      # anything. A WARNING is surfaced as an annotation but is not fatal —
      # warnings are expected in a normal run of a dictionary this size.
      shell: bash
      env:
        LOG_FILE: ${{ steps.resolve.outputs.log-file }}
      run: |
        set -uo pipefail
        # The log format puts the level first on the line, so anchoring the
        # pattern avoids matching the word inside a message body.
        if grep -n '^WARNING' "${LOG_FILE}"; then
          echo "::warning::The generator logged warnings; see the run log and the uploaded artifact."
        fi
        if grep -n '^ERROR' "${LOG_FILE}"; then
          echo "::error::The generator logged errors, so the schema is not trustworthy."
          exit 1
        fi
        echo "No errors logged."
