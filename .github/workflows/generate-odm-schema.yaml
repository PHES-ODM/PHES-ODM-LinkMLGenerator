name: Generate ODM Schema

# Regenerates the ODM v3 LinkML schema from the published parts and sets CSV
# dictionary tables, and commits the result to schemas/odm_v3.yaml so that the
# current schema is always available from this repository — see
# docs/how-to/dictionary-workflow.md, which is the manual version of this job.
#
# The dictionary lives in a different repository, so nothing here can be
# triggered by a dictionary change directly. The schedule catches an updated
# dictionary within a week; repository_dispatch lets the PHES-ODM repository
# (or anyone with a token) request a regeneration the moment the tables change;
# and the push filter catches the other half of the problem — a change to the
# generator itself producing a different schema from the same dictionary.
#
# A dispatch may carry a `dictionary_ref` in its client_payload to generate from
# a ref other than the published branch; such a run never commits. See
# docs/how-to/trigger-from-another-repository.md.
on:
  workflow_dispatch:
    inputs:
      dictionary_ref:
        description: 'Branch, tag, or SHA of PHES-ODM/PHES-ODM to read the dictionary tables from. Anything but the default generates without committing.'
        required: false
        # Kept in step with DICTIONARY_REF_DEFAULT in .github/odm-config.env by
        # hand: an input default is read before any step runs, so it cannot be
        # loaded from that file the way the rest of the settings are.
        default: 'label'
      commit:
        description: 'Commit the regenerated schema. Uncheck to generate and inspect the artifact only.'
        type: boolean
        required: false
        default: true
  schedule:
    # Mondays at 07:00 UTC.
    - cron: '0 7 * * 1'
  repository_dispatch:
    types: [ dictionary-updated ]
  push:
    branches: [ main ]
    paths:
      - 'odm_linkmlgen/**'
      - 'requirements.txt'
      - '.github/workflows/generate-odm-schema.yaml'
      - '.github/odm-config.env'
      - '.github/actions/odm-config/action.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'odm_linkmlgen/**'
      - 'requirements.txt'
      - '.github/workflows/generate-odm-schema.yaml'
      - '.github/odm-config.env'
      - '.github/actions/odm-config/action.yaml'

# Two runs committing to main at once would collide on the push. Queue them
# instead of cancelling, so a run that has already regenerated the schema is
# not thrown away; pull request runs commit nothing, so those can be cancelled.
concurrency:
  group: generate-odm-schema-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# There is no env block: which dictionary is read, which ODM version is
# generated, and where the schema is committed are the same questions for every
# workflow that touches the dictionary, so they are answered once in
# .github/odm-config.env and loaded into the environment by the first step of
# the job. The paths a run works in are inputs of
# .github/actions/generate-odm-schema, at their defaults here.

jobs:
  generate:
    name: Generate and commit
    runs-on: ubuntu-latest
    permissions:
      # To push the regenerated schema back to main.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Load the shared ODM configuration
        # Puts everything in .github/odm-config.env into the environment of
        # every step below, so this has to run before the first step that reads
        # any of it. It needs the checkout above, which is why it is not the
        # first step in the job.
        uses: ./.github/actions/odm-config

      - name: Generate the schema
        id: schema
        # Downloading the tables, running the generator, and failing on a
        # logged ERROR live in the action because the rollout workflow needs
        # exactly the same three things — see
        # .github/actions/generate-odm-schema/action.yaml.
        #
        # `||` is safe for the ref because both sides are strings and an absent
        # one arrives as the empty string, which the action treats as "not
        # given" too. It is not safe for the boolean below, which is why the
        # commit decision is made in shell.
        uses: ./.github/actions/generate-odm-schema
        with:
          dictionary-ref: ${{ inputs.dictionary_ref || github.event.client_payload.dictionary_ref }}

      - name: Decide whether to commit
        id: decide
        # Whether to commit arrives from either a workflow_dispatch input or a
        # repository_dispatch client_payload, and is resolved here so that the
        # commit step has a single answer to read.
        #
        # It is resolved in shell rather than in a GitHub expression because an
        # absent value arrives as the empty string, and a GitHub expression
        # compares the empty string equal to false: `inputs.commit != false` is
        # false on a schedule, and `inputs.commit || payload.commit` throws away
        # an explicit `false`. Shell has no such ambiguity.
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          PAYLOAD_COMMIT: ${{ github.event.client_payload.commit }}
          DICTIONARY_REF: ${{ steps.schema.outputs.ref }}
        run: |
          set -euo pipefail

          # Commit unless a caller explicitly asked not to.
          commit="${INPUT_COMMIT:-}"
          [ -n "${commit}" ] || commit="${PAYLOAD_COMMIT:-}"
          [ -n "${commit}" ] || commit=true

          # The committed schema tracks the published dictionary, so a run
          # against any other ref is for inspection only and never commits. This
          # is what makes it safe for another repository to dispatch a ref: the
          # worst it can do is spend a run and upload an artifact.
          if [ "${DICTIONARY_REF}" != "${DICTIONARY_REF_DEFAULT}" ] && [ "${commit}" = true ]; then
            commit=false
            echo "::notice::${DICTIONARY_REF} is not the default ${DICTIONARY_REF_DEFAULT} branch, so the schema will be generated but not committed."
          fi

          # A pull request only ever proves the generator still works.
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            commit=false
          fi

          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}"

      - name: Upload the schema and the intermediate stages
        # Kept for every run, including pull requests and failed runs, so a bad
        # schema can be diffed against the committed one without a local run.
        # The paths are the generate action's defaults spelled out rather than
        # read from its outputs, so that a run that failed before setting them
        # still uploads whatever it did produce.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odm-v${{ env.ODM_VERSION }}-schema
          path: |
            gen/odm_v${{ env.ODM_VERSION }}/
            gen/generate.log
          if-no-files-found: warn

      - name: Copy the schema to its committed location
        env:
          SCHEMA_FILE: ${{ steps.schema.outputs.schema-file }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SCHEMA_PATH}")"
          cp "${SCHEMA_FILE}" "${SCHEMA_PATH}"

      - name: Commit the schema
        # Whether to commit was settled by the step above, which is why this is
        # a plain string comparison and not a stack of event checks.
        # The generator's output is deterministic — no timestamps — so an
        # unchanged dictionary and an unchanged generator produce no diff, and
        # the scheduled run is a no-op.
        if: steps.decide.outputs.commit == 'true'
        env:
          DICTIONARY_REF: ${{ steps.schema.outputs.ref }}
          DICTIONARY_SHA: ${{ steps.schema.outputs.sha }}
        run: |
          set -euo pipefail
          # --porcelain covers both a modified schema and a brand new one,
          # which `git diff` on its own would not see.
          if [ -z "$(git status --porcelain -- "${SCHEMA_PATH}")" ]; then
            echo "The schema is unchanged; nothing to commit."
            echo "The regenerated schema is identical to the committed one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${SCHEMA_PATH}"
          git commit -m "Regenerate the ODM v${ODM_VERSION} LinkML schema" \
            -m "Generated from ${DICTIONARY_REPO}@${DICTIONARY_REF} (${DICTIONARY_SHA}), tables ${PARTS_CSV} and ${SETS_CSV}." \
            -m "Generated by the ${GITHUB_WORKFLOW} workflow, run ${GITHUB_RUN_ID}."
          # The branch may have moved while the schema was being generated.
          # checkout leaves HEAD detached, so this rebases the new commit onto
          # whatever the branch is now and pushes it there by name.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "### Committed an updated \`${SCHEMA_PATH}\`" >> "$GITHUB_STEP_SUMMARY"
