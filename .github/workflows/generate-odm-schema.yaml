name: Generate ODM Schema

# Regenerates the ODM v3 LinkML schema from the published parts and sets CSV
# dictionary tables, and commits the result to schemas/odm_v3.yaml so that the
# current schema is always available from this repository — see
# docs/how-to/dictionary-workflow.md, which is the manual version of this job.
#
# The dictionary lives in a different repository, so nothing here can be
# triggered by a dictionary change directly. The schedule catches an updated
# dictionary within a week; repository_dispatch lets the PHES-ODM repository
# (or anyone with a token) request a regeneration the moment the tables change;
# and the push filter catches the other half of the problem — a change to the
# generator itself producing a different schema from the same dictionary.
#
# A dispatch may carry a `dictionary_ref` in its client_payload to generate from
# a ref other than the published branch; such a run never commits. See
# docs/how-to/trigger-from-another-repository.md.
on:
  workflow_dispatch:
    inputs:
      dictionary_ref:
        description: 'Branch, tag, or SHA of PHES-ODM/PHES-ODM to read the dictionary tables from. Anything but the default generates without committing.'
        required: false
        default: 'label'
      commit:
        description: 'Commit the regenerated schema. Uncheck to generate and inspect the artifact only.'
        type: boolean
        required: false
        default: true
  schedule:
    # Mondays at 07:00 UTC.
    - cron: '0 7 * * 1'
  repository_dispatch:
    types: [ dictionary-updated ]
  push:
    branches: [ main ]
    paths:
      - 'odm_linkmlgen/**'
      - 'requirements.txt'
      - '.github/workflows/generate-odm-schema.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'odm_linkmlgen/**'
      - 'requirements.txt'
      - '.github/workflows/generate-odm-schema.yaml'

# Two runs committing to main at once would collide on the push. Queue them
# instead of cancelling, so a run that has already regenerated the schema is
# not thrown away; pull request runs commit nothing, so those can be cancelled.
concurrency:
  group: generate-odm-schema-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ODM_VERSION: '3'
  # Where the dictionary tables are published. The v3 tables are on the `label`
  # branch of the PHES-ODM repository.
  DICTIONARY_REPO: PHES-ODM/PHES-ODM
  DICTIONARY_DIR: dictionary-tables
  # The dictionary branch the committed schema tracks. A run that was pointed at
  # any other ref generates the schema but does not commit it.
  DICTIONARY_REF_DEFAULT: label
  PARTS_CSV: ODM_parts_v3.0.0.csv
  SETS_CSV: ODM_sets_v3.0.0.csv
  # Where the downloaded tables are staged. Under gen/, which is git-ignored,
  # and not the --output-dir, which the generator clears before reading them.
  DOWNLOAD_DIR: gen/dictionary-download
  # The committed location of the generated schema. This is the path other
  # repositories should read the ODM v3 schema from.
  SCHEMA_PATH: schemas/odm_v3.yaml

jobs:
  generate:
    name: Generate and commit
    runs-on: ubuntu-latest
    permissions:
      # To push the regenerated schema back to main.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the generator
        run: pip install -r requirements.txt && pip install -e . --no-deps

      - name: Resolve the dictionary ref and whether to commit
        id: dictionary
        # Both choices a caller can make — which dictionary ref to read, and
        # whether to commit — arrive from either a workflow_dispatch input or a
        # repository_dispatch client_payload, and are resolved here so that
        # every later step has a single answer to read.
        #
        # They are resolved in shell rather than in a GitHub expression because
        # an absent value arrives as the empty string, and a GitHub expression
        # compares the empty string equal to false: `inputs.commit != false` is
        # false on a schedule, and `inputs.commit || payload.commit` throws away
        # an explicit `false`. Shell has no such ambiguity.
        #
        # The resolved SHA goes into the commit message, so a committed schema
        # can always be traced back to the exact tables it came from.
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.dictionary_ref }}
          INPUT_COMMIT: ${{ inputs.commit }}
          PAYLOAD_REF: ${{ github.event.client_payload.dictionary_ref }}
          PAYLOAD_COMMIT: ${{ github.event.client_payload.commit }}
        run: |
          set -euo pipefail

          # An explicit input wins, then the dispatch payload, then the default.
          ref="${INPUT_REF:-}"
          [ -n "${ref}" ] || ref="${PAYLOAD_REF:-}"
          [ -n "${ref}" ] || ref="${DICTIONARY_REF_DEFAULT}"

          # The ref reaches a URL, and on a dispatch it comes from outside this
          # repository, so it is held to what a branch, tag, or SHA can look
          # like rather than trusted.
          case "${ref}" in
            *[!A-Za-z0-9._/-]* | *..* | /* | */ | -*)
              echo "::error::Refusing the dictionary ref '${ref}': expected a plain branch, tag, or SHA."
              exit 1
              ;;
          esac

          # Commit unless a caller explicitly asked not to.
          commit="${INPUT_COMMIT:-}"
          [ -n "${commit}" ] || commit="${PAYLOAD_COMMIT:-}"
          [ -n "${commit}" ] || commit=true

          # The committed schema tracks the published dictionary, so a run
          # against any other ref is for inspection only and never commits. This
          # is what makes it safe for another repository to dispatch a ref: the
          # worst it can do is spend a run and upload an artifact.
          if [ "${ref}" != "${DICTIONARY_REF_DEFAULT}" ] && [ "${commit}" = true ]; then
            commit=false
            echo "::notice::${ref} is not the default ${DICTIONARY_REF_DEFAULT} branch, so the schema will be generated but not committed."
          fi

          # A pull request only ever proves the generator still works.
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            commit=false
          fi

          sha=$(gh api "repos/${DICTIONARY_REPO}/commits/${ref}" --jq '.sha')

          {
            echo "ref=${ref}"
            echo "sha=${sha}"
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"
          echo "Using ${DICTIONARY_REPO}@${ref} (${sha}); commit=${commit}"

      - name: Download the dictionary tables
        # Pinned to the resolved SHA rather than the branch, so the two tables
        # cannot come from different commits if the branch moves mid-run. They
        # go under gen/, which is git-ignored, so the only thing this run adds
        # to the working tree is the schema itself.
        env:
          DICTIONARY_SHA: ${{ steps.dictionary.outputs.sha }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${DICTIONARY_REPO}/${DICTIONARY_SHA}/${DICTIONARY_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          curl -sSfL -o "${DOWNLOAD_DIR}/${PARTS_CSV}" "${base}/${PARTS_CSV}"
          curl -sSfL -o "${DOWNLOAD_DIR}/${SETS_CSV}" "${base}/${SETS_CSV}"
          wc -l "${DOWNLOAD_DIR}"/*.csv

      - name: Generate the schema
        # --output-dir must not be the directory the CSVs were downloaded to:
        # the generator clears it before reading them. Errors in the source
        # dictionary are logged and skipped rather than raised, so the exit
        # status alone does not tell us whether the run produced a usable
        # schema — hence the log, which the next step checks. The generator
        # logs to stdout, so the redirect is only for anything underneath it
        # that writes to stderr.
        run: |
          set -euo pipefail
          odm-linkmlgen-odm \
            --version "${ODM_VERSION}" \
            --parts-file "${DOWNLOAD_DIR}/${PARTS_CSV}" \
            --sets-file "${DOWNLOAD_DIR}/${SETS_CSV}" \
            --output-dir "gen/odm_v${ODM_VERSION}" \
            2>&1 | tee gen/generate.log

      - name: Check the log for errors
        # A run that exits 0 can still have produced a degraded schema: the
        # generator logs a defect in the source dictionary and carries on
        # rather than raising, so one bad part does not cost the whole run.
        # An ERROR therefore fails the job and stops the commit. A WARNING is
        # surfaced as an annotation but is not fatal — warnings are expected in
        # a normal run of a dictionary this size.
        run: |
          set -uo pipefail
          # The log format puts the level first on the line, so anchoring the
          # pattern avoids matching the word inside a message body.
          if grep -n '^WARNING' gen/generate.log; then
            echo "::warning::The generator logged warnings; see the run log and the uploaded artifact."
          fi
          if grep -n '^ERROR' gen/generate.log; then
            echo "::error::The generator logged errors, so the schema is not trustworthy and was not committed."
            exit 1
          fi
          echo "No errors logged."

      - name: Upload the schema and the intermediate stages
        # Kept for every run, including pull requests and failed runs, so a bad
        # schema can be diffed against the committed one without a local run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odm-v${{ env.ODM_VERSION }}-schema
          path: |
            gen/odm_v${{ env.ODM_VERSION }}/
            gen/generate.log
          if-no-files-found: warn

      - name: Copy the schema to its committed location
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SCHEMA_PATH}")"
          cp "gen/odm_v${ODM_VERSION}/linkml/odm_v${ODM_VERSION}.yaml" "${SCHEMA_PATH}"

      - name: Commit the schema
        # Whether to commit was settled by the resolve step, which is why this
        # is a plain string comparison and not a stack of event checks.
        # The generator's output is deterministic — no timestamps — so an
        # unchanged dictionary and an unchanged generator produce no diff, and
        # the scheduled run is a no-op.
        if: steps.dictionary.outputs.commit == 'true'
        env:
          DICTIONARY_REF: ${{ steps.dictionary.outputs.ref }}
          DICTIONARY_SHA: ${{ steps.dictionary.outputs.sha }}
        run: |
          set -euo pipefail
          # --porcelain covers both a modified schema and a brand new one,
          # which `git diff` on its own would not see.
          if [ -z "$(git status --porcelain -- "${SCHEMA_PATH}")" ]; then
            echo "The schema is unchanged; nothing to commit."
            echo "The regenerated schema is identical to the committed one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${SCHEMA_PATH}"
          git commit -m "Regenerate the ODM v${ODM_VERSION} LinkML schema" \
            -m "Generated from ${DICTIONARY_REPO}@${DICTIONARY_REF} (${DICTIONARY_SHA}), tables ${PARTS_CSV} and ${SETS_CSV}." \
            -m "Generated by the ${GITHUB_WORKFLOW} workflow, run ${GITHUB_RUN_ID}."
          # The branch may have moved while the schema was being generated.
          # checkout leaves HEAD detached, so this rebases the new commit onto
          # whatever the branch is now and pushes it there by name.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "### Committed an updated \`${SCHEMA_PATH}\`" >> "$GITHUB_STEP_SUMMARY"
