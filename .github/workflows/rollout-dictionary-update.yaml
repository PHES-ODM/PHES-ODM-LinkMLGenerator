name: Roll Out Dictionary Update

# Automates docs/how-to/dictionary-workflow.md: regenerates the ODM v3 LinkML
# schema from the published dictionary tables, regenerates the LinkML-Map
# schemas and the PHES-ODM-Validation assets that depend on it, and publishes
# all of it.
#
# Where it publishes to is decided by .github/odm-rollout.yaml, and right now
# that is a staging repository rather than the repositories the manual process
# names. The published dictionary tables are behind the current dictionary, so
# a schema generated from them is OLDER than the odm_v3.yaml files already
# committed to those repositories, and a live run would replace newer files
# with older ones. The staged run produces the same tree, filed under the
# repository and path each file was meant for, so it can be reviewed without
# overwriting anything. See docs/how-to/automate-dictionary-rollout.md.
#
# Manual only, deliberately: this workflow writes to other repositories, and
# until the dictionary tables are current there is nothing a schedule could
# usefully do.
on:
  workflow_dispatch:
    inputs:
      dictionary_ref:
        description: 'Branch, tag, or SHA of PHES-ODM/PHES-ODM to read the dictionary tables from.'
        required: false
        # Kept in step with DICTIONARY_REF_DEFAULT in .github/odm-config.env by
        # hand: an input default is read before any step runs, so it cannot be
        # loaded from that file the way the rest of the settings are.
        default: 'label'
      publish:
        description: 'Publish the result. Uncheck to build everything and inspect the artifacts without writing to any repository.'
        type: boolean
        required: false
        default: true
      allow_live:
        description: 'Permit writing to the real target repositories. Only has an effect if staging.repo has been cleared in .github/odm-rollout.yaml, and overwrites files there.'
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [ dictionary-rollout ]

# A rollout pushes to another repository, so two at once would collide. Queued
# rather than cancelled, so a run that has already built everything is not
# thrown away.
concurrency:
  group: rollout-dictionary-update
  cancel-in-progress: false

# Nothing is written to this repository. Publishing uses ROLLOUT_TOKEN, since
# the workflow's own token cannot reach another repository at all.
permissions:
  contents: read

jobs:
  # Step 1 of the manual process. Also produces the parts and sets tables,
  # which step 5 needs and which are not the same files as the ones published
  # in the dictionary repository — the generator normalises them.
  schema:
    name: Generate the schema
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.schema.outputs.ref }}
      sha: ${{ steps.schema.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Load the shared ODM configuration
        uses: ./.github/actions/odm-config

      - name: Generate the schema
        id: schema
        uses: ./.github/actions/generate-odm-schema
        with:
          dictionary-ref: ${{ inputs.dictionary_ref || github.event.client_payload.dictionary_ref }}

      - name: Collect the products
        # products/ holds only what this job contributes to the rollout, in the
        # layout .github/odm-rollout.yaml refers to by name. Each job uploads
        # its own products and the publish job merges them.
        env:
          SCHEMA_FILE: ${{ steps.schema.outputs.schema-file }}
          DICTIONARY_DIR: ${{ steps.schema.outputs.dictionary-dir }}
        run: |
          set -euo pipefail
          mkdir -p products/schema products/dictionary
          cp "${SCHEMA_FILE}" products/schema/
          cp "${DICTIONARY_DIR}/parts.csv" "${DICTIONARY_DIR}/sets.csv" products/dictionary/
          find products -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: rollout-schema
          path: products
          if-no-files-found: error

      - name: Upload the generator log
        # Named so that it does not match the rollout-* pattern the publish job
        # downloads: the log is for reading, not for publishing. The path is the
        # generate action's default spelled out rather than read from its
        # outputs, so that a run which failed before setting them still uploads
        # whatever log it managed to write.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-log
          path: gen/generate.log
          if-no-files-found: warn

  # Step 3. The mappers are generated by another repository's tool, against the
  # schema this run just generated, so this job checks that repository out and
  # replaces its copy of the schema before running it.
  mappers:
    name: Regenerate the LinkML-Map schemas
    needs: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the rollout configuration
        # yq is preinstalled on the runners. Every value the steps below need
        # is read here so that the configuration file is touched in one place.
        run: |
          set -euo pipefail
          config=.github/odm-rollout.yaml
          {
            echo "MAP_REPO=$(yq '.map_generator.repo' "${config}")"
            echo "MAP_REF=$(yq '.map_generator.ref' "${config}")"
            echo "MAP_PYTHON=$(yq '.map_generator.python' "${config}")"
            echo "MAP_SCHEMA_DEST=$(yq '.map_generator.schema_dest' "${config}")"
          } >> "$GITHUB_ENV"

      - name: Check out the map generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAP_REPO }}
          ref: ${{ env.MAP_REF }}
          path: map-generator

      - name: Download the generated schema
        uses: actions/download-artifact@v4
        with:
          name: rollout-schema
          path: inputs

      - name: Put the generated schema where the map generator reads it
        # The mappers map to whatever schema is at this path, so a stale one
        # here would quietly produce stale mappers. The basename comes from the
        # configured destination rather than from a glob, so a run fails
        # outright if the generated schema is not named what the map generator
        # expects.
        run: |
          set -euo pipefail
          cp "inputs/schema/$(basename "${MAP_SCHEMA_DEST}")" \
             "map-generator/${MAP_SCHEMA_DEST}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.MAP_PYTHON }}
          cache: pip
          cache-dependency-path: map-generator/requirements.txt

      - name: Install the map generator
        run: |
          set -euo pipefail
          pip install -r map-generator/requirements.txt
          pip install -e ./map-generator --no-deps

      - name: Generate the mappers
        # One run per configured mapping. Each config file already holds every
        # option the run needs, including where it writes, which is why the
        # only thing passed here is the config itself.
        run: |
          set -euo pipefail
          mkdir -p products
          yq '.map_generator.mappers[] | .name + "|" + .config + "|" + .output + "|" + .product' \
            .github/odm-rollout.yaml |
          while IFS='|' read -r name config output product; do
            echo "::group::${name}"
            ( cd map-generator && python odm_map_maker/make_mappers_cli.py --config "${config}" )
            mkdir -p "products/${product}"
            cp "map-generator/${output}"/*.yaml "products/${product}/"
            echo "$(ls -1 "products/${product}" | wc -l) mapper file(s) for ${name}"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rollout-mappers
          path: products
          if-no-files-found: error

  # Step 5, the generation half. PHES-ODM-Validation does not read the LinkML
  # schema at all: it builds its own validation schemas from the parts and sets
  # tables, which is why this job needs the dictionary products rather than the
  # schema.
  validation:
    name: Regenerate the validation assets
    needs: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the rollout configuration
        run: |
          set -euo pipefail
          config=.github/odm-rollout.yaml
          {
            echo "VAL_REPO=$(yq '.validation.repo' "${config}")"
            echo "VAL_REF=$(yq '.validation.ref' "${config}")"
            echo "VAL_PYTHON=$(yq '.validation.python' "${config}")"
            echo "VAL_DICT_VERSION=$(yq '.validation.dictionary_version' "${config}")"
            echo "VAL_DICT_DIR=$(yq '.validation.dictionary_dir' "${config}")"
            echo "VAL_SCHEMAS_DIR=$(yq '.validation.schemas_dir' "${config}")"
            echo "VAL_TABLES_DIR=$(yq '.validation.tables_dir' "${config}")"
            echo "VAL_SCRIPT=$(yq '.validation.generate_assets' "${config}")"
          } >> "$GITHUB_ENV"

      - name: Check out the validation repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VAL_REPO }}
          ref: ${{ env.VAL_REF }}
          path: validation

      - name: Download the dictionary tables
        uses: actions/download-artifact@v4
        with:
          name: rollout-schema
          path: inputs

      - name: Put the tables in a versioned dictionary directory
        # That repository works out which ODM versions to generate assets for
        # by listing the directories under its dictionary directory, so this
        # directory existing is what makes it generate anything for this
        # version at all.
        run: |
          set -euo pipefail
          dest="validation/${VAL_DICT_DIR}/${VAL_DICT_VERSION}"
          mkdir -p "${dest}"
          cp inputs/dictionary/parts.csv inputs/dictionary/sets.csv "${dest}/"
          ls -la "${dest}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VAL_PYTHON }}
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - name: Install the validation requirements
        # Requirements only, no install of the package itself: the script is
        # run from the checkout, and that repository resolves its asset
        # directory to the checkout root when the package is not installed,
        # which is exactly what a run needs.
        run: pip install -r validation/requirements.txt

      - name: Generate the validation assets
        # Regenerates every version's assets, not just this one — the script
        # has no way to be asked for one version, and the manual process pushes
        # all of them too.
        run: |
          set -euo pipefail
          cd validation
          PYTHONPATH=src python3 "${VAL_SCRIPT}"

      - name: Collect the products
        run: |
          set -euo pipefail
          mkdir -p products/validation/validation-schemas products/validation/odm
          cp "validation/${VAL_SCHEMAS_DIR}"/* products/validation/validation-schemas/
          cp "validation/${VAL_TABLES_DIR}"/* products/validation/odm/
          find products -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: rollout-validation
          path: products
          if-no-files-found: error

  # Steps 2, 4 and the second half of 5: everything built above, written to
  # wherever .github/odm-rollout.yaml says it goes.
  publish:
    name: Publish
    needs: [ schema, mappers, validation ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load the shared ODM configuration
        uses: ./.github/actions/odm-config

      - name: Decide whether to publish
        id: decide
        # Resolved in shell rather than in a GitHub expression because an
        # absent value arrives as the empty string, and a GitHub expression
        # compares the empty string equal to false — so `inputs.publish ||
        # payload.publish` would throw away an explicit `false`.
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          PAYLOAD_PUBLISH: ${{ github.event.client_payload.publish }}
          INPUT_ALLOW_LIVE: ${{ inputs.allow_live }}
          PAYLOAD_ALLOW_LIVE: ${{ github.event.client_payload.allow_live }}
        run: |
          set -euo pipefail

          publish="${INPUT_PUBLISH:-}"
          [ -n "${publish}" ] || publish="${PAYLOAD_PUBLISH:-}"
          [ -n "${publish}" ] || publish=true

          # Never defaults to true, and a dispatch from another repository
          # cannot turn it on: writing to the real targets is a decision made
          # here, deliberately, by someone who can see the configuration.
          allow_live="${INPUT_ALLOW_LIVE:-}"
          [ -n "${allow_live}" ] || allow_live="${PAYLOAD_ALLOW_LIVE:-}"
          [ -n "${allow_live}" ] || allow_live=false
          if [ "${allow_live}" = true ] && [ "${GITHUB_EVENT_NAME}" != workflow_dispatch ]; then
            allow_live=false
            echo "::notice::allow_live is ignored on a ${GITHUB_EVENT_NAME} event."
          fi

          {
            echo "publish=${publish}"
            echo "allow_live=${allow_live}"
          } >> "$GITHUB_OUTPUT"
          echo "publish=${publish} allow_live=${allow_live}"

      - name: Download everything that was built
        uses: actions/download-artifact@v4
        with:
          pattern: rollout-*
          merge-multiple: true
          path: products

      - name: Show what will be published
        run: find products -type f | sort

      - uses: actions/upload-artifact@v4
        # The whole tree in one artifact, so that a run with publishing off
        # still leaves something to inspect.
        with:
          name: dictionary-rollout-products
          path: products
          if-no-files-found: error

      - name: Set up Python
        if: steps.decide.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install the publisher's requirements
        if: steps.decide.outputs.publish == 'true'
        run: pip install pyyaml

      - name: Publish
        if: steps.decide.outputs.publish == 'true'
        env:
          # A fine-grained token with Contents write on the destination
          # repositories. The workflow's own token cannot write to another
          # repository, so without this secret there is nothing to do.
          ROLLOUT_TOKEN: ${{ secrets.ROLLOUT_TOKEN }}
          DICTIONARY_REF: ${{ needs.schema.outputs.ref }}
          DICTIONARY_SHA: ${{ needs.schema.outputs.sha }}
          ALLOW_LIVE: ${{ steps.decide.outputs.allow_live }}
        run: |
          set -euo pipefail
          args=(
            --config .github/odm-rollout.yaml
            --products-dir products
            --work-dir work
            --odm-version "${ODM_VERSION}"
            --dictionary-repo "${DICTIONARY_REPO}"
            --dictionary-ref "${DICTIONARY_REF}"
            --dictionary-sha "${DICTIONARY_SHA}"
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )
          if [ "${ALLOW_LIVE}" = true ]; then
            args+=(--allow-live)
          fi
          python3 .github/scripts/publish_rollout.py "${args[@]}"
