# What a dictionary rollout builds, and where it writes it.
#
# Read by the Roll Out Dictionary Update workflow
# (.github/workflows/rollout-dictionary-update.yaml), which automates
# docs/how-to/dictionary-workflow.md. Which dictionary it reads and which ODM
# version it generates are not here — those are shared with the other
# workflows and live in .github/odm-config.env.
#
# A run builds these products, and the `product` fields under `targets` name
# them. A trailing slash means a directory, and every file in it is copied:
#
#   schema/odm_v3.yaml                the generated ODM LinkML schema
#   dictionary/parts.csv              the parts table, named as its consumers want it
#   dictionary/sets.csv               the sets table, likewise
#   mappers/<mapping>/                the LinkML-Map schemas for one mapping
#   validation/validation-schemas/    what generate_assets.py wrote
#   validation/odm/                   the table-name files it wrote alongside them
#
# Adding a location to publish to means adding one entry under `targets`.
# Nothing else in the workflow needs to change.

# ---------------------------------------------------------------------------
# Where a run writes. This is the safety switch.
# ---------------------------------------------------------------------------
staging:
  # While `repo` is set, nothing at all is written to the repositories under
  # `targets`. Every product is written into this one repository instead, at
  # <dir>/<owner>/<repo>/<the path it was meant for>, so that a run can be
  # reviewed in the shape it would have landed in.
  #
  # This is not scaffolding to be removed as soon as it works. The dictionary
  # tables published on DICTIONARY_REF_DEFAULT are behind the current
  # dictionary, so a schema generated from them is older than the odm_v3.yaml
  # already committed to the target repositories — and the same is true of the
  # LinkML-Map schemas on PHES-ODM-Mapper and the assets on
  # PHES-ODM-Validation. A live run today would replace newer files with older
  # ones. Set `repo` to '' only once the published tables are current, and note
  # that a live run needs the workflow's `allow_live` input as well.
  repo: PHES-ODM/PHES-ODM-RolloutStaging
  branch: main
  # Everything under this directory is replaced by each run, so what is in it
  # is always one run's output rather than two runs merged. It also keeps the
  # rest of the staging repository — its README, say — out of the way.
  dir: rollout

# ---------------------------------------------------------------------------
# Step 3 of the rollout: the LinkML-Map schemas, which are generated by
# another repository's tool rather than by this one.
# ---------------------------------------------------------------------------
map_generator:
  repo: PHES-ODM/PHES-ODM-MapGenerator
  ref: main
  python: '3.10'
  # Where the freshly generated ODM schema has to be placed in that checkout
  # before the mappers are generated: it is the target schema every mapping
  # maps to, so the mappers are only as current as the schema put here.
  schema_dest: odm_map_maker/data/odm_v3/linkml/odm_v3.yaml
  # One entry per mapping. `config` is the mapping's config file, `output` is
  # where that config writes its mappers, both relative to the checkout, and
  # `product` is the name the `targets` entries below use. A mapping targeting
  # ODM v2 is deliberately absent: the same mapper files serve, and mapping to
  # v2 is discouraged.
  mappers:
    - name: odm-v1-to-v3
      config: odm_map_maker/configs/odm_v1_to_odm.yaml
      output: gen/odm-v1-to-v3/mappers
      product: mappers/odm-v1-to-v3
    - name: nwss-reporting-to-v3
      config: odm_map_maker/configs/nwss_to_odm.yaml
      output: gen/nwss-reporting-to-v3/mappers
      product: mappers/nwss-reporting-to-v3
    - name: pha4ge-to-v3
      config: odm_map_maker/configs/pha4ge_to_odm.yaml
      output: gen/pha4ge-to-v3/mappers
      product: mappers/pha4ge-to-v3

# ---------------------------------------------------------------------------
# Step 5 of the rollout: the validation assets, which are not generated from
# the LinkML schema at all but from the parts and sets tables directly.
# ---------------------------------------------------------------------------
validation:
  repo: PHES-ODM/PHES-ODM-Validation
  ref: main
  python: '3.10'
  # The dictionary version directory the parts and sets tables are copied to
  # inside the checkout. That repository discovers which versions to generate
  # by listing the directories under assets/dictionary/, so this directory
  # existing is what makes it generate a schema for this version at all.
  dictionary_version: v3.0.1
  # Where it reads the tables from and writes its assets to, relative to the
  # checkout.
  dictionary_dir: assets/dictionary
  schemas_dir: assets/validation-schemas
  tables_dir: assets/odm
  # The script that turns the tables into validation schemas.
  generate_assets: src/odm_validation/tools/generate_assets.py

# ---------------------------------------------------------------------------
# Steps 2, 4 and 5 of the rollout: where each product is published.
#
# `repo` and `path` are the real destination, and are what a live run writes
# to. While `staging.repo` is set they are used to lay the product out inside
# the staging repository instead, which is why they are still worth keeping
# accurate now.
#
# `replace: true` empties the destination directory first. Use it wherever the
# product is a whole directory whose old contents are not wanted — a mapping
# that stops producing a mapper file should stop shipping it.
# ---------------------------------------------------------------------------
targets:
  # Step 2: the ODM LinkML schema.
  - name: MapGenerator schema
    repo: PHES-ODM/PHES-ODM-MapGenerator
    path: odm_map_maker/data/odm_v3/linkml
    product: schema/odm_v3.yaml

  - name: Mapper shared schema
    repo: PHES-ODM/PHES-ODM-Mapper
    path: odm_map/data/modules/_shared/schemas
    product: schema/odm_v3.yaml

  - name: Search-MCP schema
    repo: PHES-ODM/PHES-ODM-Search-MCP
    path: odm_search_mcp/data/schemas
    product: schema/odm_v3.yaml

  - name: General-Skill schema
    repo: PHES-ODM/PHES-ODM-General-Skill
    path: skills/phes-odm-general/references
    product: schema/odm_v3.yaml

  # This repository is private, so a live run needs a token that can write to
  # it; a staged run needs nothing, since it is never contacted.
  - name: QPCR-Pipeline schema
    repo: PHES-ODM/PHES-ODM-QPCR-Pipeline
    path: schemas
    product: schema/odm_v3.yaml

  # Step 4: the LinkML-Map schemas, one destination per mapping.
  - name: Mapper ODM v1 to v3 mappers
    repo: PHES-ODM/PHES-ODM-Mapper
    path: odm_map/data/modules/odm-v1-to-v3/mappers
    product: mappers/odm-v1-to-v3/
    replace: true

  - name: Mapper NWSS reporting to v3 mappers
    repo: PHES-ODM/PHES-ODM-Mapper
    path: odm_map/data/modules/nwss-reporting-to-v3/mappers
    product: mappers/nwss-reporting-to-v3/
    replace: true

  - name: Mapper PHA4GE to v3 mappers
    repo: PHES-ODM/PHES-ODM-Mapper
    path: odm_map/data/modules/pha4ge-to-v3/mappers
    product: mappers/pha4ge-to-v3/
    replace: true

  # Step 5: the validation assets. The dictionary version in the first path
  # repeats validation.dictionary_version above — the tables have to be read
  # from a versioned directory in the checkout for the script to see them, and
  # written to the same one here.
  - name: Validation dictionary tables
    repo: PHES-ODM/PHES-ODM-Validation
    path: assets/dictionary/v3.0.1
    product: dictionary/

  - name: Validation schemas
    repo: PHES-ODM/PHES-ODM-Validation
    path: assets/validation-schemas
    product: validation/validation-schemas/

  - name: Validation table names
    repo: PHES-ODM/PHES-ODM-Validation
    path: assets/odm
    product: validation/odm/
