          with `protocolIDSub` or `stepIDSub` and `relationshipID` the row of `protocolRelationships`
          should say: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        range: integer
        minimum_value: 1
      relationshipID:
        description: Attribute for specifying the relationship between a sample subject
          and object.
        title: Relationship between entities
        notes:
        - 'Together with `sampleIDSubject` and `sampleRelID`, a row of the `sampleRelationships`
          should say: [sampleIDSubject] is a [sampleID] of [sampleIDObject]'
        range: sampleRelSet, protocolRelSet
        required: true
        pattern: ^.{0,30}$
      protocolIDSub:
        description: The subject of the relationship between one protocol and another
          protocol or step, within a given protocol ID container.
        title: Protocol ID subject
        notes:
        - 'Populate this field using Protocol ID (partID = protocolID). Together with
          `protocolIDObj` or `stepIDObj` and `relationshipID` the row of `protocolRelationships`
          should say: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        range: string
        pattern: ^.{0,30}$
      stepIDSub:
        description: The subject of the relationship between one protocol step and
          another step or protocol, within a given protocol ID container.
        title: Step ID Subject
        notes:
        - 'Populate this field using Protocol ID (partID = stepID). Together with
          `protocolIDSub` or `stepIDSub` and `relationshipID` the row of `protocolRelationships`
          should say: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        range: string
        pattern: ^.{0,30}$
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
  samples:
    slots:
    - sampleID
    - repType
    - collType
    - collPer
    - collNum
    - pooled
    - collDT
    - collDTStart
    - collDTEnd
    - sentDate
    - recDate
    - protocolID
    - reportable
    - lastEdited
    - notes
    - organizationID
    - contactID
    - siteID
    - purpose
    - saMaterial
    - datasetID
    - origin
    - collNumPer
    slot_usage:
      sampleID:
        description: Unique identifier for a sample.
        title: Sample ID
        notes:
        - Suggestion:siteID-date-index.
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      repType:
        description: Attirbute of a sample, specifying whether the sample is unique,
          or a replicate. And if it is a replicate, what type of replicate is it?
        title: Replicate Type
        range: replicateSet
        pattern: ^.{0,30}$
      collType:
        description: The type of collection.
        title: Sample collection type
        range: collectSet
        required: true
        pattern: ^.{0,12}$
      collPer:
        description: Collection period. The time period over which the sample was
          collected, in hours. Alternatively, use collectionStart and collectionEnd.
        title: Collection period
        notes:
        - 'Examples: 1 hour, 6 hours, 24 hours'
        range: float
        required: true
        minimum_value: 1
      collNum:
        description: The number of subsamples that were combined to create the sample.
          Use NA for continuous, proportional or passive sampling.
        title: Collection number
        range: integer
        required: true
        minimum_value: 1
      pooled:
        description: Is this a pooled sample, and therefore composed of multiple child
          samples obtained at different sites
        title: Pooled
        range: booleanSet
        pattern: ^.{0,30}$
      collDT:
        description: For grab samples this is the date, time and timezone the sample
          was taken.
        title: Collection date time
        range: datetime
        required: true
        pattern: ^.{0,30}$
      collDTStart:
        description: For integrated time averaged samples this is the date, time and
          timezone the sample was started being taken.
        title: Collection date time start
        range: datetime
        pattern: ^.{0,30}$
      collDTEnd:
        description: For integrated time average samples this is the date, time and
          timezone the sample was finished being taken.
        title: Collection date time end
        range: datetime
        pattern: ^.{0,30}$
      sentDate:
        title: Date sample was sent
        range: datetime
        pattern: ^.{0,30}$
      recDate:
        description: The date the sample was received at the laboratory for analysis.
        title: Date sample recieved
        range: datetime
        pattern: ^.{0,30}$
      protocolID:
        description: A unique identifier for a given protocol.
        title: Protocol ID
        range: string
        pattern: ^.{0,30}$
      reportable:
        description: Flag for whether a measure is reportable or not, based on confidence
          in the measure and methods applied.
        title: Reportable
        range: booleanSet
        pattern: ^.{0,10}$
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        range: datetime
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attrbitutes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        range: string
        pattern: ^.{0,200}$
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
        range: string
        pattern: ^.{0,100}$
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
        range: string
        pattern: ^.{0,30}$
      siteID:
        description: Unique identifier for the location where a sample was taken.
        title: Site ID
        range: string
        required: true
        pattern: ^.{0,30}$
      purpose:
        description: The reason the measure or sample was taken.
        title: Purpose
        notes:
        - 'See allowed categories: report, quality control, validation study, test'
        range: purposeSet
        pattern: ^.{0,30}$
      saMaterial:
        description: Type of sample.
        title: Sample material
        range: sampleMatSet
        required: true
        pattern: ^.{0,30}$
      datasetID:
        description: The name of the dataset that stores information for MeasureReport,
          SampleReport and other reporting tables.
        title: Dataset ID
        notes:
        - Where possible, datasetID name should correspond the orignial data custodian
          responsible for generating environmental data. (suggestion for a default
          name convention.)
        range: string
        pattern: ^.{0,30}$
      origin:
        description: An attribute of a sample specifying the origin.
        title: Sample origin
        range: origins
        pattern: ^.{0,30}$
      collNumPer:
        description: Composite collection number.period.
        title: Collection period and number
        notes:
        - 'This a composite measure that combines `collection period` (collPer) and
          `collection number` (collNum). Collection number and period can be used
          to reduce the number of table headings during data collection. In data storage,
          `collNum` and `collPeriod` should be transformed to `collPer` and `collNum`.
          For Grab sample, Surface swab, or Area proportional sample just enter 1


          In case of Composite, Flow-proportional collection, the number of subsamples
          followed by a dot, followed by the period of the sampling, in hours.

          For example, for 4 composite subsamples covering a 8 hours period, the entry
          would be 4.2

          For time-proportional 24 subsamples collected every hour, the entry would
          be 24.1

          For volume-proportional, the entry for 24 subsamples collected over 24 hours
          should be 24.24, in this case the period part of the entry should be understood
          as the total collection time instead of the periodicity of the collection.


          For a COSCA ball or Moore swab collecting for 24 hours, the entry would
          be 1.24'
        range: string
        pattern: ^.{0,6}$
  measures:
    slots:
    - measureRepID
    - protocolID
    - sampleID
    - purpose
    - polygonID
    - siteID
    - datasetID
    - measureSetRepID
    - aDateStart
    - aDateEnd
    - reportDate
    - compartment
