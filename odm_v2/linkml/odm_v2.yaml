          \ / Listeria / Enterovirus / Rotavirus / Astrovirus / Sapovirus / Chlamydia\
          \ / Trichomonas vaginalis / Neisseria gonorrhoeae / Treponema pallidum /\
          \ Human Immunodeficiency Virus (HIV) / Human Papiloma Virus (HPV) / Mycoplasma\
          \ genitalus / Epstein\u2013Barr virus (EBV) / Herpes / Haemophilus ducreyi\
          \ / Ureaplasma / Hepatitis A / Hepatitis B / Hepatitis C / Hepatitis E /\
          \ Clostridium difficile / Varicella / Measles / Mumps / Rubella / Corynebacterium\
