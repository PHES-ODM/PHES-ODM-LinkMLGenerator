        description: Sample was frozen before analysis or processing
        title: Sample frozen
      spill:
        description: Sample contents spilled from container.
        title: Sample spilled
      sC:
        description: Sequencing shows sparse coverage, ie. numerical breadth of coverage
          shows as adequate but coverage plots reveal missing genome pieces.
