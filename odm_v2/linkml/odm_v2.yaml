        description: A description of the frequency of a variants detected.
        title: Frequency of variants detected
      xg:
        description: RCF (Relative Centrifugal Force) denotes the degree of force
          exerted on a sample. RCF is quantified in multiples of the gravitational
          acceleration that is standard at the Earth's surface (x g). Thus, the terms
          RCF and XG are often used interchangeably in centrifugation protocols.
        title: Relative Centrifugal Force (RCF) or x g units
      rpm:
        description: RPM stands for "Revolutions per minute." This is how centrifuge
          manufacturers generally describe how fast the centrifuge is going. The rotor,
          regardless of its size, is revolving at that rate.
        title: Revolutions per minute (RPM)
      uL:
        description: The unit of microlitres.
        title: Micro-litres
      nM:
        description: the unit of nanomolar.
        title: Nano-molar
      seconds:
        description: The unit of time, seconds.
        title: Seconds
