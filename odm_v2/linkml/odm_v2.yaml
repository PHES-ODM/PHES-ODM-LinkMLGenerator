  measQualitySet:
    description: A quality set for any measure, includes all the quality flag options
      for any measure.
    title: Measures quality set
    from_schema: https://onto.phes-odm.org/odmv2
    permissible_values:
      noConcern:
        description: A flag to indicate there is are no quality concern about the
          measure or sample.
        title: No quality concerns
      qf1:
        description: A flag to indicate there is a quality concern, not otherwise
          sepcified.
        title: Quality concerns
      mI:
        description: Multiple issues have arisen in the sequencing process.
        title: Multiple issues
      flagAI:
        description: The original sample was inhibited; however, the inhibition has
          been addressed through dilution. The reported concentration estimate is
          the updated result after addressing inhibition.
        title: AI - Inhibition present but addressed
      flagB:
        description: "Analytical result may be subject to \u201Ctrace\u201D levels\
          \ of contamination; the target analyte was also detected in negative controls\
          \ on the same run as the sample."
        title: B - Trace levels of contamination
      expFail:
        description: PCR experiment failed. No value reported.
        title: Experiment Failed
      flagFI:
        description: The original sample was inhibited; however, the inhibition has
          not been successfully addressed. Therefore, no concentration estimate has
          been reported.
        title: FI - Inhibition present and unaddressed
      flagJ:
        description: Analytical result falls below the lowest concentration of the
          experiment-specific standard curve but above the y-intercept value; the
          reported value is based on the extrapolation of the standard curve in the
          non-linear region.
        title: J - Weak signal extrapolation
      flagND:
        description: No amplification occurred in the reaction; non-detect.
        title: ND - Non-detect
      flagUJ:
        description: "Observed quantitation cycle is greater than the experiment-specific\
          \ standard curve intercept value but evidence of clear amplification was\
          \ present (i.e., \u201Ctrace\u201D signal observed); the reported value\
          \ is based on the extrapolation of the standard curve in the non-linear\
          \ region."
        title: UJ - Trace signal extrapolation
      flagUQ:
        description: Unquantifiable, Ct value exceeds the maximum value of the standard
          curve. There was a detect, but we cannot quantify it with certainty.
        title: UQ - Unquantifiable
      lBC:
        description: The percentage of the genome covered by reads (the breadth) is
          low.
        title: Low breadth of coverage
      lDC:
        description: Poor coverage, specifically an insufficient number of reads or
          too many sequencing reads that are mapped incorrectly.
        title: Low depth of coverage
      noTime:
        description: Sample is missing the autosampler time; incomplete metadata on
          collection.
        title: Sample missing time stamp
      sC:
        description: Sequencing shows sparse coverage, ie. numerical breadth of coverage
          shows as adequate but coverage plots reveal missing genome pieces.
        title: Sparse coverage
      wi: {}
      oor:
        description: Value is outside of the allowable range for quality control.
        title: Value out of range
      out:
        description: Value is an outlier and may be of questionable quality.
        title: Value is an outlier
