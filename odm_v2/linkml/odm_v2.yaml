name: ODMv2
description: Data model for the Public Health Environmental Surveillance Open Data
  Model, version 2
id: https://onto.phes-odm.org/odm/v2
imports:
- linkml:types
prefixes:
  odmv2: https://onto.phes-odm.org/odm/v2/
  linkml: https://w3id.org/linkml/
default_prefix: odmv2
default_range: string
enums:
  absHumidUnitSet:
    description: Unit set for absolute humidity measurements.
    title: Absolute humidity unit set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      gm3:
        description: Density unit.
        title: Gram per cubic metre
  airCompartmentSet:
    description: A compartment set for measures and methods in the air compartment.
    title: Air compartment set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      air:
        description: A measure or observation made from a substance in the air.
        title: Air compartment
  airSurfaceCompartmentSet:
    description: A compartment set for measures and methods in the air or surface
      compartments.
    title: Air and surface compartment set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      air:
        description: A measure or observation made from a substance in the air.
        title: Air compartment
      surf:
        description: A measure or observation made from a substance on a surface.
        title: Surface compartment
  airWaterCompartmentSet:
    description: A compartment set for measures and methods in the air or water compartments.
    title: Air and water compartment set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      air:
        description: A measure or observation made from a substance in the air.
        title: Air compartment
  airportSheetSet:
    description: Worksheets in the full airport surveillance template (list + template).
    title: Airport Sheets Set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      airportLists:
        description: Parts lists used to generate airport and airplane data entry
          templates.
        title: Airport lists worksheet
      airportTemplate:
        description: The input template for airport and airplane surveillance in the
          EU.
        title: Airport Surveillance Template
  alleleUnitSet:
    description: Unit set for alleles.
    title: Allele unit set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      ct:
        description: Cycle thresholds in a PCR assay.
        title: Cycle threshold or quantification cycle (Ct or Cq)
      doc:
        description: The sequencing read depth.
        title: Depth of coverage
      gcCrA:
        description: Gene or variant copies per copy of crAssphage.
        title: Gene copies per copy of crAssphage
      gCGS:
        description: Gene or variant copies per gram solids.
        title: Gene copies per gram solids
      gcMl:
        description: Gene or variant copies per millilitre of solution.
        title: Gene copies per mL
      gcD100:
        description: The unit for measures reflecting the gene copies per day per
          100,000 people in the population.
        title: gene copies per day per 100,000
      det:
        description: Substance detected or not detected.
        title: Detected
      gcPpmov:
        description: Gene or variant copies per copy of PMMoV.
        title: Gene copies per PMMoV copy
      slope:
        description: Slope value of the calibration curve.
        title: slope
      inter:
        description: Intercept value of the calibration curve.
        title: Intercept
      efficient:
        description: The efficiency reported for a standard curve.
        title: Efficiency
      r2:
        description: R-squared value of the calibration curve.
        title: R squared
  anyCompartmentSet:
    description: A compartment set for measures and methods in any compartment.
    title: Any compartment set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      air:
        description: A measure or observation made from a substance in the air.
        title: Air compartment
      surf:
        description: A measure or observation made from a substance on a surface.
        title: Surface compartment
      wat:
        description: A measure or observation made from a substance in the water,
          including wastewater.
        title: Water compartment
  anySpecimenSet:
    description: A specimen set that inculdes any specimen.
    title: Any specimen set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      po:
        description: An measure or observation for a geographic area or population.
        title: Population
      sa:
        description: A measure made on a compartment or property from a sample of
          a substance.
        title: Sample
      si:
        description: A measure made on a compartment or property at a site.
        title: Site
  bacteriaUnitSet:
    description: Unit set for bacteria-related measurements.
    title: Bacteria unit set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      cfu:
        description: Colony forming units per 100 ml of filtered sample.
        title: CFU per 100 ml
  booleanAggrSet:
    description: Aggreagation set for boolean.
    title: Boolean aggregation set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      sin:
        description: A value that is not an aggregate measurement (ie. not a mean,
          median, max or any other) and can be a replicate value.
        title: Single
      orBoo:
        description: '"OR" aggreation.'
        title: OR Boolean aggregation
      andBoo:
        description: '"AND" aggreation.'
        title: AND Boolean aggregation
  booleanSet:
    description: Set that contains the valid possible values for a boolean measure
      (TRUE or FALSE).
    title: Boolean value set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      'true':
        description: Boolean data type = TRUE
        title: 'True'
      'false':
        description: Boolean data type = FALSE
        title: 'False'
  capacityUnitSet:
    description: Unit set for capacity measurements.
    title: Capacity unit set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      mgd:
        description: A unit for measuring of design capacity for wastewater treatment
          plants, represented as millions of gallons per day. Also can be used to
          measure flow.
        title: Millions of gallons per day (MG/D)
      mld:
        description: Megalitres per day.
        title: Megalitres per day (ML/d)
      popEq:
        description: A unit for measuring of design capacity for wastewater treatment
          plants, represented as the approximate amount of water a signle person would
          use.
        title: Population equivalents
  collectSet:
    description: Methods for collection samples.
    title: Sample collection set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      areaPr:
        description: An area proportional sample.
        title: Area proportional sample
      cosca:
        description: COSCa passive sampling device.
        title: COSCa ball
      flowPr:
        description: A flow proportional composite sample generally collected by an
          autosampler.
        title: Flow proportional sample
      grb:
        description: A single large representative grab sample.
        title: Grab sample
      moorSw:
        description: Moore swab passive sample.
        title: Moore swab passive sample
      surfSw:
        description: Surface swab.
        title: Surface swab
      timePr:
        description: A time proportional composite sample generally collected by an
          autosampler.
        title: Time proportional sample
      volPr:
        description: A volume proportional sample generally collected by an autosampler.
        title: Volume proportional sample
      comp:
        description: A composite sample, usually generated by an autosampler.
        title: Composite sample - archival
  conductivityUnitSet:
    description: Unit set related to conductivity measurements.
    title: Conductivity unit set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      uSCm:
        description: Micro-siemens per centimetre.
        title: Micro-Siemens per centimetre
  contactTableSet:
    description: Tables are where measures, methods and attributes are recorded. Tables
      represent the main entities of the environmental surveillance.
    title: Contact table set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      sites:
        description: The table that contains information about a site; the location
          where an environmental sample was taken.
        title: Sites table
      organizations:
        description: The table that contains information about a laboratory.
        title: Organization table
      contacts:
        description: The table that contains information about a contact; a person
          who is the contact of a site or laboratory.
        title: Contact table
      addresses:
        description: The table that contains information about addresses. Addresses
          can recorded for sites, organizations or contacts (indivduals).
        title: Address table
  dictionaryRefTableSet:
    description: Reference or look-up tables.
    title: Dictionary reference table set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      parts:
        description: Look up table containing all parts in of the data model.
        title: Parts Look-up table
      sets:
        description: Look up table for all sets, managing how categorical inputs for
          various methods and attributes are grouped together.
        title: Sets look-up table
      languages:
        description: Look up table for all languages, used to give structure to the
          translation table.
        title: Language Look-up table
      countries:
        description: Look up table for the possible country inputs.
        title: Countries look-up tables
      zones:
        description: Look up table for the possible sub-national region or zone inputs.
        title: Zones look-up table
      translations:
        description: Look up table for translations of the description, label, and
          instruction for all parts.
        title: Translation look-up table
  dissGasUnitSet:
    description: Unit set for carbon dioxide concentrations measurements in water
      or air.
    title: Dissolved gas concentration unit set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      mgL:
        description: Milligrams per litre.
        title: Milligrams per litre
      ppm:
        description: Parts per million.
        title: parts per million
  erdTableSet:
    description: All tables listed in the Entity Relationship Diagram.
    title: ERD table set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      addresses:
        description: The table that contains information about addresses. Addresses
          can recorded for sites, organizations or contacts (indivduals).
        title: Address table
      contacts:
        description: The table that contains information about a contact; a person
          who is the contact of a site or laboratory.
        title: Contact table
      datasets:
        description: A report table for capturing details about data's parental data
          set and data custodians. Supplying attribution for data collectors.
        title: Dataset table
      instruments:
        description: The table that contains information about instruments.
        title: Instrument table
      languages:
        description: Look up table for all languages, used to give structure to the
          translation table.
        title: Language Look-up table
      measures:
        description: The table that contains information and details about a given
          measure
        title: Measure report table
      measureSets:
        description: The table that identifies sets of measures.
        title: Measure set report table
      organizations:
        description: The table that contains information about a laboratory.
        title: Organization table
      parts:
        description: Look up table containing all parts in of the data model.
        title: Parts Look-up table
      polygons:
        description: The table that contains information about the geometry of a geographic
          area.
        title: Polygon table
      protocolRelationships:
        description: The table that contains the organizational information and details
          (such as order) about a given protocol, recorded as a series of protocol
          steps (protocolSteps).
        title: Protocol relationships table
      protocols:
        description: The table for protocols.
        title: Protocols table
      protocolSteps:
        description: The table for collecting metadata on individual steps in a protocol,
          methodological process, or assay.
        title: Protocol steps table
      qualityReports:
        description: The table for recording the various quality metrics and indicators
          for samples and measures.
        title: Quality reports table
      reportersDep:
        description: The table that contains information about a reporter of a sample,
          method, measure, or attribute.
        title: Reporter table depreciated
      sampleRelationships:
        description: Table for recording the relationships between samples.
        title: Sample relationships table
      samples:
        description: The table that contains information about a sample. A sample
          is defined as a representative volume of wastewater (or other forms of water
          or liquid), air, or surface area taken from a site.
        title: Sample report table
      sets:
        description: Look up table for all sets, managing how categorical inputs for
          various methods and attributes are grouped together.
        title: Sets look-up table
      countries:
        description: Look up table for the possible country inputs.
        title: Countries look-up tables
      zones:
        description: Look up table for the possible sub-national region or zone inputs.
        title: Zones look-up table
      sites:
        description: The table that contains information about a site; the location
          where an environmental sample was taken.
        title: Sites table
  extractSet:
    description: set used for storing all the valid category values for the nucleic
      acid extraction method.
    title: Nucleic Acid Extraction set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      extract4s:
        description: Nucleic acid extraction performed using the 4s method.
        title: 4s method
      amiMP96:
        description: Nucleaic acid extraction, usually used for the liquid fraction
          of a wastewater sample, using amicon filtration and using an MP96 for final
          extraction.
        title: Amicon filter, extract with MP96
      bbMP96:
        description: Nucleaic acid extraction, usually used for solid fraction of
          a wastewater sample, using bead beating and using an MP96 for final extraction.
        title: Bead beating, extract with MP96
      chemVir:
        description: Nucleic acid extraction performed using the chemagic viral dna/rna
          300 kit.
        title: Chemagic viral dna/rna 300 kit
      nucAuto:
        description: Nucleic acid extraction performed using the nuclisens automated
          magnetic bead extraction kit.
        title: Nuclisens automated magnetic bead extraction kit
      nucManu:
        description: Nucleic acid extraction performed using the nuclisens manual
          magnetic bead extraction kit.
        title: Nuclisens manual magnetic bead extraction kit
      phenCl:
        description: Nucleic acid extraction performed using phenol chloroform.
        title: Phenol chloroform
      promAuto:
        description: Nucleic acid extraction performed using the promega automated
          tna kit.
        title: promega automated tna kit
      promHt:
        description: Nucleic acid extraction performed using the promega ht tna kit.
        title: promega ht tna kit
      promManu:
        description: Nucleic acid extraction performed using the promega manual tna
          kit.
        title: promega manual tna kit
      promWW:
        description: Nucleic acid extraction performed using the promega wastewater
          large volume tna capture kit.
        title: promega wastewater large volume tna capture kit
      qgDNARNA:
        description: Nucleic acid extraction performed using the qiagen allprep dna/rna
          kit.
        title: qiagen allprep dna/rna kit
      qgEz1:
        description: Nucleic acid extraction performed using the qiagen ez1 virus
          mini kit v2.0.
        title: qiagen ez1 virus mini kit v2.0
      qgPwrFecal:
        description: Nucleic acid extraction performed using the qiagen allprep powerfecal
          dna/rna kit.
        title: qiagen allprep powerfecal dna/rna kit
      qgPwrViral:
        description: Nucleic acid extraction performed using the qiagen allprep powerviral
          dna/rna kit.
        title: qiagen allprep powerviral dna/rna kit
      qgPwrWtr:
        description: Nucleic acid extraction performed using the qiagen powerwater
          kit.
        title: qiagen powerwater kit
      qgQiAmp:
        description: Nucleic acid extraction performed using the qiagen qiaamp buffers
          with epoch columns.
        title: qiagen qiaamp buffers with epoch columns
      qgRneasy:
        description: Nucleic acid extraction performed using the qiagen rneasy kit.
        title: qiagen rneasy kit
      qgRneasyPwr:
        description: Nucleic acid extraction performed using the qiagen rneasy powermicrobiome
          kit.
        title: qiagen rneasy powermicrobiome kit
      resCosca:
        description: Nucleic acid extraction via resuspension of a sample collected
          using the COSCa ball method.
        title: Resuspend COSCa filter collection
      thermMag:
        description: Nucleic acid extraction performed using the thermo magmax microbiome
          ultra nucleic acid isolation kit.
        title: thermo magmax microbiome ultra nucleic acid isolation kit
      trizol:
        description: Nucleic acid extraction performed using the trizol, zymo mag
          beads w/ zymo clean and concentrator method.
        title: trizol, zymo mag beads w/ zymo clean and concentrator
      zymoEnv:
        description: Nucleic acid extraction performed using the zymo environ water
          rna kit/ zymo environ water rna kit (cat. r2042).
        title: zymo environ water rna kit/ zymo environ water rna kit (cat. r2042)
      zymoQuick:
        description: 'Nucleic acid extraction performed using the zymo quick-rna fungal/bacterial
          miniprep #r2014 kit.'
        title: 'zymo quick-rna fungal/bacterial miniprep #r2014'
